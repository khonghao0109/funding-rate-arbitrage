      maker_bps: 1.5
      taker_bps: 4.5
      verified: true
      doc_url: https://hyperliquid.gitbook.io/hyperliquid-docs/trading/fees
      note_vi: "Perps bậc 0 (không yêu cầu khối lượng): maker 0,015% · taker 0,045%."
    # SUY RA, không phải trường sàn công bố. Đo 2026-09-07: POST /info {"type":"meta"}
    # cho maxLeverage = 40 với BTC (25 ETH, 20 SOL), và tài liệu Hyperliquid nêu
    # quy tắc "maintenance margin bằng MỘT NỬA initial margin ở đòn bẩy tối đa"
    # → 1/(2×40) = 0,0125 cho BTC. Đánh dấu verified: false vì đây là một phép
    # suy từ quy tắc trong tài liệu chứ không phải một con số đọc được từ API,
    # và nó KHÁC NHAU theo từng coin — BTC 0,0125 nhưng SOL 1/(2×20) = 0,025.
    margin:
      maintenance_frac: 0.0125
      max_leverage: 40
      verified: false
      doc_url: https://hyperliquid.gitbook.io/hyperliquid-docs/trading/margining
      note_vi: >-
        Suy ra từ maxLeverage của BTC. Khác nhau theo coin, nên một giá trị duy
        nhất ở đây đã sai với SOL/XRP — cần fetcher theo coin trước khi bật.

