# Cấu hình scanner — nguồn sự thật DUY NHẤT cho cặp giao dịch, danh sách nguồn,
# ngưỡng và biểu phí.
#
# Mục tiêu của Bước 1.4: thêm một cặp hoặc một sàn chỉ cần sửa file này, không
# đụng vào Go lẫn JavaScript. Dashboard dựng toàn bộ danh sách nguồn, màu, nhãn
# và bộ chọn cặp từ message `meta`, mà `meta` sinh ra từ đây.
#
# Ngoại lệ DUY NHẤT còn lại: một sàn hoàn toàn mới cần một connector mới viết
# bằng Go. Trường `connector` bên dưới chọn trong số connector đã có; thêm một
# sàn dùng connector sẵn có thì không cần code.

server:
  # Cổng HTTP. Biến môi trường PORT vẫn được ưu tiên nếu có.
  port: "8082"

scanner:
  # Ngưỡng chênh lệch THÔ để phát cảnh báo, tính bằng phần trăm.
  #
  # Cố ý đo trên số THÔ chứ không phải số sau phí: một vòng mở–đóng cả hai chân
  # tốn khoảng 0,19% nên lọc theo số sau phí sẽ tắt gần hết cảnh báo. Quyết định
  # "cái gì đáng hành động" là việc của Giai đoạn 3. Mỗi cảnh báo vẫn mang theo
  # số sau phí của chính nó.
  alert_min_spread_pct: 0.05

  # Ngưỡng mặc định cho nguồn không khai `stale_after_sec` riêng.
  default_stale_after_sec: 10

# Lưu trữ SQLite (Bước 2.6).
#
# Mọi chu kỳ dưới đây là một HỆ SỐ NHÂN SỐ DÒNG, nên chúng nằm ở config chứ
# không phải hằng số trong code: 4 cặp × 9 nguồn lấy mẫu mỗi 5s là khoảng
# 622.000 dòng giá mỗi ngày; để 1s thì gấp năm.
storage:
  # false = scanner chạy y như trước Bước 2.6: không mở file, không ghi gì.
  enabled: true
  path: "data/scanner.db"

  # Chu kỳ lấy mẫu top-of-book, tính bằng giây.
  #
  # ⚠️ ĐO THẬT 2026-09-04 trên đúng schema này: **133,3 byte/dòng**
  # (`MEASURE_STORE=1 go test -run TestPriceSnapshotRowCost ./internal/store/`).
  # Với 36 chuỗi và 90 ngày lưu trữ:
  #     5s  → 56,0 triệu dòng ≈ 7,46 GB
  #    10s  → 28,0 triệu dòng ≈ 3,73 GB
  #    30s  →  9,3 triệu dòng ≈ 1,24 GB   ← đang dùng
  #    60s  →  4,7 triệu dòng ≈ 0,62 GB
  # PLAN 2.6 đề xuất 1–5s khi chưa có số đo. Vị thế funding giữ hàng NGÀY, nên
  # 30s vẫn cho 2.880 mẫu/ngày/chuỗi mà tốn 1/6 dung lượng.
  price_sample_every_sec: 30

  # Bổ sung funding lịch sử từ REST. Mỗi tick hỏi 7 sàn, mà mốc settle nhanh
  # nhất trong hệ là 1 giờ (Kraken, Hyperliquid) — 60 phút là vừa đủ dày.
  #
  # Chi phí đo được mỗi tick: ~30 request, trong đó Kraken luôn trả **cả năm
  # trong một response 1 MB** bất kể cửa sổ (sàn không có phân trang), tức
  # ~4 MB/giờ cho 4 cặp. Đây là kho backtest chứ không phải dữ liệu quyết định,
  # nên nới lên 240 phút hoàn toàn hợp lệ nếu băng thông đáng quan tâm.
  funding_topup_every_min: 60

  # Ảnh chụp quy tắc giao dịch. Khoá theo NGÀY (UTC), nên chụp nhiều lần trong
  # ngày chỉ ghi đè ảnh của ngày đó — 6 giờ để một lần fetch hỏng không xoá
  # trắng ảnh của cả ngày.
  instrument_snapshot_every_hours: 6

  prune_every_hours: 24

  # Thời gian giữ, tính bằng NGÀY. 0 = giữ vĩnh viễn.
  #
  # ⚠️ funding là thứ DUY NHẤT ở đây không lấy lại được: OKX chỉ công bố ~90
  # ngày, Gate 180 ngày. Cắt xuống dưới ngưỡng đó là mất vĩnh viễn, nên config
  # từ chối mọi giá trị từ 1 đến 29.
  retain_funding_days: 365
  retain_price_days: 90

# Độ sâu sổ lệnh (Bước 2.7b). Lấy qua REST theo chu kỳ, KHÔNG stream: vị thế
# funding giữ hàng ngày tới hàng tuần, nên không có lý do biết sổ lệnh đổi từng
# mili-giây. `depth` incremental với sequence number và resync chỉ đáng khi đang
# thực sự đặt lệnh — đó là Bước 4.4. Xem PLAN §7.4.
depth:
  enabled: true

  # Mỗi lượt quét là 1 request/market (4 cặp × 9 nguồn = 36 request). PLAN §7.4
  # đề xuất 1–4 giờ; 60 phút là đầu nhanh của khoảng đó và vẫn 24 mẫu/ngày.
  refresh_every_min: 60

  # Số mức hỏi mỗi phía. Mỗi fetcher tự KẸP xuống trần của sàn nó, nên con số
  # này đọc là "xin sâu nhất có thể".
  #
  # ⚠️ ĐO 2026-09-04 trên BTCUSDT — 100 mức là KHÔNG ĐỦ. Độ trải của sổ trả về,
  # tính theo % quanh mid, ở 100 mức so với trần từng sàn:
  #
  #   binance_futures  100 → 0,017%   1000 → 0,161%   (trần fetcher 1000)
  #   binance_spot     100 → 0,028%   1000 → 0,235%   (sàn cho tới 5000)
  #   bybit_futures    100 → 0,024%    500 → 0,101%   (trần tài liệu 500)
  #   bybit_spot       100 → 0,084%    200 → 0,177%   (trần tài liệu 200)
  #   gate_futures     100 → 0,077%    300 → 0,175%   (400 trả HTTP 400)
  #   okx_futures      100 → 0,024%    400 → 0,077%   (trần cứng, KHÔNG tới 0,1%)
  #   hyperliquid       20 → 0,024%    — cố định 20 mức, không nới được
  #   kraken           cả sổ → 99,99%  — không có tham số limit
  #   paradex          100 → 14,5%     — sổ mỏng nên trải rất rộng
  #
  # Với 100 mức thì 7/9 sàn không chạm nổi cửa sổ hẹp 0,1%, nên gần như mọi con
  # số độ sâu là CẬN DƯỚI và bảng xếp hạng sẽ phản ánh "sàn nào trả nhiều mức
  # nhất" chứ không phải "sàn nào sâu nhất". Đặt 1000 để mỗi sàn cho hết mức nó
  # cho; OKX và Hyperliquid vẫn không tới được và được gắn cờ `covers_0_1pct`.
  levels: 1000

  # Lưu bao lâu. 0 = GIỮ TẤT CẢ.
  #
  # ⚠️ Đây là chuỗi DUY NHẤT không backfill được. Funding lịch sử thì sàn công
  # bố lại sau nhiều tháng; sổ lệnh biến mất ngay khi nó đổi, nên mỗi giờ không
  # ghi là một giờ GĐ 3 vĩnh viễn không mô hình hoá được slippage. Một năm quét
  # theo giờ trên 36 market là ~315k dòng — nhỏ hơn một ngày price sample.
  retain_days: 365

# Các cặp scanner theo dõi.
#
# `base` và `quote` được khai tường minh, không suy ra từ hậu tố chuỗi: suy ra
# kiểu đó là cách "DOGEUSDT" trở thành base "DOG". Chúng dùng để dựng ký hiệu
# riêng của từng sàn qua `symbol_format` bên dưới.
# ─── Bước 3.5: bộ đánh giá tín hiệu SỐNG (chế độ chỉ-ghi-nhật-ký) ───────────
# Cùng bộ tham số cmd/backtest dùng mặc định, để nhật ký tín hiệu sống và
# backtest so được với nhau qua CÙNG cửa sổ. Không đặt lệnh: đây là vị thế
# GIẤY, tiến trình không giữ credential. Mọi ngưỡng là BẮT BUỘC khi bật —
# không có mặc định ngầm, vì một ngưỡng code tự điền là ngưỡng không ai chọn.
strategy:
  enabled: true
  evaluate_every_min: 10      # funding settle nhanh nhất là 1h; 10 phút là dư
  max_book_age_min: 120       # phải ≥ depth.refresh_every_min, nếu không mọi fill bị coi là cũ
  min_rate_per_8h_bps: 0.5    # ngưỡng rate ĐÃ SETTLE, quy về 8h để so chéo sàn
  persistence_periods: 3      # số mốc settle liên tiếp phải trên ngưỡng
  min_net_apr_frac: 0.02      # APR RÒNG tối thiểu để vào (0.02 = 2%)
  notional_quote: 50000       # vốn mỗi vị thế giấy — slippage tính theo đúng size này
  holding_days: 30            # thời gian giữ dự kiến, để khấu hao chi phí vào/ra
  exit_net_apr_frac: 0.005    # sàn giữ, thấp hơn sàn vào để không churn
  exit_persistence_periods: 3 # thoát do suy giảm cần N mốc liên tiếp dưới sàn giữ
  max_basis_pct: 1.0          # thoát nếu |perp − spot| vượt mức này
  max_basis_widen_pct: 0.5    # thoát nếu basis dịch xa mức lúc vào hơn mức này

symbols:
  - { symbol: BTCUSDT, base: BTC, quote: USDT }
  - { symbol: ETHUSDT, base: ETH, quote: USDT }
  - { symbol: XRPUSDT, base: XRP, quote: USDT }
  - { symbol: SOLUSDT, base: SOL, quote: USDT }

# Nguồn dữ liệu. Thứ tự ở đây quyết định thứ tự cột của ma trận spread và thứ tự
# hàng của danh sách nguồn trên dashboard.
#
# Cách một cặp được đổi sang ký hiệu của sàn, xét theo thứ tự:
#   1. có trong `symbol_map` → dùng giá trị đó
#   2. có `symbol_format`    → thay {base}/{quote}/{symbol} vào khuôn
#   3. `symbol_map` không rỗng mà cặp không có trong đó → BỎ QUA cặp này ở sàn này
#   4. không có cả hai        → dùng nguyên ký hiệu chuẩn
#
# `stale_after_sec` là ngưỡng "báo giá quá cũ để so sánh", ĐO chứ không đoán:
# quan sát 5 phút trên cả 4 cặp lúc thị trường hoạt động, lấy khoảng cách cập
# nhật tệ nhất của từng sàn rồi để dư khoảng 3 lần. Con số chỉ đúng cho 4 cặp
# lớn trong giờ hoạt động; cặp thanh khoản mỏng hoặc giờ đêm cần đo lại.
#
# `funding_stale_after_sec` là chuyện KHÁC và lớn hơn nhiều (Bước 2.7). Giá về
# theo mỗi thay đổi sổ lệnh; funding về khi sàn quyết định phát lại. Đo
# 2026-09-04 trên cổng 8085, 44 phút liên tục, khoảng cách phát tệ nhất:
#
#   binance 16s (REST premiumIndex poll 15s) · okx 67s · paradex 71s ·
#   gate 4s · kraken 1s · hyperliquid 1s   → ngưỡng = ~3× worst, sàn 60s
#   bybit  KHÔNG CÓ TRẦN theo quan sát: 2.639s (44 phút) và vẫn tăng
#
# ⚠️ Paradex là lý do phải đo ĐỦ LÂU: sau 4 phút nó cho 18s, sau 44 phút cho
# 71s. Ngưỡng 60s đặt theo cửa sổ ngắn sẽ báo nhầm một feed khoẻ là chết.
#
# `funding_publish_mode` nói vì sao. `periodic` = sàn phát theo nhịp của nó, nên
# TUỔI đo được sức sống. `on_change` = chỉ phát khi một trường funding đổi giá
# trị thật (Bước 2.5 sửa Bybit thành như vậy để một stream delta 100ms không làm
# subscription chết trông như luôn tươi) — im lặng là trạng thái BÌNH THƯỜNG và
# tuổi không chứng minh được gì. Trần duy nhất chứng minh được của `on_change`
# là CHU KỲ SETTLE: mốc settle kế tiếp đổi thì sàn buộc phải phát lại. Nên
# ngưỡng của Bybit đặt bằng 8h + 5 phút — nó không phải công cụ phát hiện chết,
# mà chỉ là cái chặn cuối. Thứ phát hiện chết ở đó là `source_status` (im lặng
# trên MỌI loại message) và phép kiểm "mốc settle đã trôi qua".
#
# `fee` là biểu phí bậc mặc định (chưa VIP). `verified: true` nghĩa là con số đã
# đọc từ tài liệu của chính sàn và `doc_url` chỉ tới đó. `verified: false` nghĩa
# là CHƯA TRA ĐƯỢC, KHÔNG phải miễn phí — Paradex tính 0% thật cho tài khoản
# Retail, nên số 0 là một mức phí có thật và phải phân biệt bằng cờ này. Cặp nào
# có một sàn `verified: false` thì không có số sau phí.
#
# Nếu bạn có tài khoản trên các sàn này, hãy thay bằng biểu phí bậc của CHÍNH
# BẠN và đặt `verified: true` — đó mới là con số đúng, vì phí phụ thuộc bậc VIP
# và khối lượng 30 ngày.
sources:
  - source: binance_futures
    connector: binance_futures
    venue: binance
    market_type: perp
    quote_asset: USDT
    tradable: true
    label: Binance Futures
    short_label: BIN-F
    color: "#f0b90b"
    line_style: solid
    enabled_by_default: true
    stale_after_sec: 10          # gap tệ nhất quan sát được 0,85s
    funding_stale_after_sec: 60  # poll REST 15s, gap tệ nhất 16s
    funding_publish_mode: periodic
    fee:
      maker_bps: 2.0
      taker_bps: 5.0
      verified: true
      doc_url: https://www.binance.com/en/support/faq/detail/360033544231
      note_vi: >-
        USDⓈ-M futures, Regular User. Con số nằm trong ví dụ tính toán trên trang
        hỗ trợ chính thức của Binance; bảng biểu phí gốc (/en/fee/futureFee) đòi
        đăng nhập.

  - source: bybit_futures
    connector: bybit_futures
    venue: bybit
    market_type: perp
    quote_asset: USDT
    tradable: true
    label: Bybit Futures
    short_label: BYB-F
    color: "#f7931a"
    line_style: solid
    enabled_by_default: true
    stale_after_sec: 10          # gap tệ nhất quan sát được 2,25s
    # 8h + 5 phút: trần chứng minh được, không phải số quan sát (xem đầu mục).
    funding_stale_after_sec: 29100
    funding_publish_mode: on_change
    fee:
      maker_bps: 2.0
      taker_bps: 5.5
      verified: true
      doc_url: https://www.bybit.com/en/help-center/article/Trading-Fee-Structure
      note_vi: >-
        Perpetual & Futures Contracts, VIP 0: taker 0,0550% · maker 0,0200%.
        Help Center của Bybit, cập nhật 2026-09-02, đọc 2026-09-07. Trang
        announcement-info/fee-rate/ redirect về trang chủ — dùng Help Center
        thay thế. Bybit ghi rõ phí thực tế có thể khác theo khu vực; số đúng
        nằm ở trang My Fee Rate sau khi xác minh danh tính.

  - source: hyperliquid_futures
    connector: hyperliquid_futures
    venue: hyperliquid
    market_type: perp
    quote_asset: USD
    tradable: true
    label: Hyperliquid Futures
    short_label: HYP
    color: "#97FCE4"
    line_style: solid
    enabled_by_default: true
    stale_after_sec: 20          # gap tệ nhất quan sát được 6,05s
    funding_stale_after_sec: 60  # activeAssetCtx đẩy liên tục, gap tệ nhất 1s
    funding_publish_mode: periodic
    # Hyperliquid gọi thị trường bằng tên coin. Trước Bước 1.4 chỗ này là
    # symbol[:3], chỉ đúng vì cả 4 cặp hiện có base dài đúng 3 ký tự —
    # "DOGEUSDT" sẽ lặng lẽ đăng ký nhầm sang "DOG".
    symbol_format: "{base}"
    fee:
      maker_bps: 1.5
      taker_bps: 4.5
      verified: true
      doc_url: https://hyperliquid.gitbook.io/hyperliquid-docs/trading/fees
      note_vi: "Perps bậc 0 (không yêu cầu khối lượng): maker 0,015% · taker 0,045%."

  - source: kraken_futures
    connector: kraken_futures
    venue: kraken
    market_type: perp
    # Kraken quote bằng USD, không phải USDT. Đây là lý do nó nằm nhóm riêng:
    # so PF_XBTUSD với BTCUSDT là đo cả chênh USD/USDT.
    quote_asset: USD
    tradable: true
    label: Kraken Futures
    short_label: KRK-F
    color: "#5a5aff"
    line_style: solid
    enabled_by_default: true
    stale_after_sec: 10          # gap tệ nhất quan sát được 2,95s
    funding_stale_after_sec: 60  # ticker mang funding mỗi frame, gap tệ nhất 1s
    funding_publish_mode: periodic
    symbol_format: "PF_{base}USD"
    symbol_map:
      # Kraken gọi bitcoin là XBT, nên khuôn ở trên không áp dụng được.
      BTCUSDT: PF_XBTUSD
    fee:
      maker_bps: 2.0
      taker_bps: 5.0
      verified: true
      doc_url: https://www.kraken.com/features/fee-schedule
      note_vi: "Kraken Futures bậc 1 (khối lượng futures 30 ngày < 5 triệu USD)."

  - source: okx_futures
    connector: okx_futures
    venue: okx
    market_type: perp
    quote_asset: USDT
    tradable: true
    label: OKX Futures
    short_label: OKX-F
    color: "#1890ff"
    line_style: solid
    enabled_by_default: true
    stale_after_sec: 10          # gap tệ nhất quan sát được 1,00s
    funding_stale_after_sec: 210 # kênh funding-rate ~60s, gap tệ nhất 67s
    funding_publish_mode: periodic
    symbol_format: "{base}-{quote}-SWAP"
    fee:
      maker_bps: 2.0
      taker_bps: 5.0
      verified: true
      doc_url: https://www.gate.com/announcements/article/36485/announcement-on-adjustment-to-usdt-m-perpetual-futures-fees
      note_vi: >-
        Perpetual swap, bậc thấp nhất: maker 0,02% · taker 0,05%. Trang learn
        của chính OKX, đọc 2026-09-07. Bảng phí đầy đủ vẫn đòi đăng nhập —
        cùng tình trạng với khối binance_futures ở trên.

  - source: gate_futures
    connector: gate_futures
    venue: gate
    market_type: perp
    quote_asset: USDT
    tradable: true
    label: Gate.io Futures
    short_label: GAT-F
    color: "#6c5ce7"
    line_style: solid
    enabled_by_default: true
    stale_after_sec: 15          # gap tệ nhất quan sát được 3,37s, book_ticker đẩy theo thay đổi
    funding_stale_after_sec: 60  # futures.tickers mang funding mỗi frame, gap tệ nhất 4s
    funding_publish_mode: periodic
    symbol_format: "{base}_{quote}"
    fee:
      maker_bps: 2.0
      taker_bps: 5.0
      verified: true
      doc_url: https://www.okx.com/en-us/learn/what-is-okx-perpetual-futures
      note_vi: >-
        USDT-M Perpetual Futures, VIP0: maker 0,020% · taker 0,0500%. Thông báo
        chính thức của Gate, đề ngày 2024-05-09, đọc 2026-09-07. Thông báo nói
