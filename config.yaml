# Cấu hình scanner — nguồn sự thật DUY NHẤT cho cặp giao dịch, danh sách nguồn,
# ngưỡng và biểu phí.
#
# Mục tiêu của Bước 1.4: thêm một cặp hoặc một sàn chỉ cần sửa file này, không
# đụng vào Go lẫn JavaScript. Dashboard dựng toàn bộ danh sách nguồn, màu, nhãn
# và bộ chọn cặp từ message `meta`, mà `meta` sinh ra từ đây.
#
# Ngoại lệ DUY NHẤT còn lại: một sàn hoàn toàn mới cần một connector mới viết
# bằng Go. Trường `connector` bên dưới chọn trong số connector đã có; thêm một
# sàn dùng connector sẵn có thì không cần code.

server:
  # Cổng HTTP. Biến môi trường PORT vẫn được ưu tiên nếu có.
  port: "8082"

scanner:
  # Ngưỡng chênh lệch THÔ để phát cảnh báo, tính bằng phần trăm.
  #
  # Cố ý đo trên số THÔ chứ không phải số sau phí: một vòng mở–đóng cả hai chân
  # tốn khoảng 0,19% nên lọc theo số sau phí sẽ tắt gần hết cảnh báo. Quyết định
  # "cái gì đáng hành động" là việc của Giai đoạn 3. Mỗi cảnh báo vẫn mang theo
  # số sau phí của chính nó.
  alert_min_spread_pct: 0.05

  # Ngưỡng mặc định cho nguồn không khai `stale_after_sec` riêng.
  default_stale_after_sec: 10

  # Một PHIÊN WebSocket được phép còn sống mà không giao ĐƯỢC dữ liệu nào
  # trong bao lâu, trước khi connector tự dựng lại nó (nối lại = đăng ký lại).
  # 0 = tắt. Nguồn khai `data_silence_sec` riêng thì số riêng thắng.
  #
  # KHÁC hẳn `stale_after_sec`, và luôn LỚN HƠN nhiều. `stale_after_sec` nói
  # "đừng tin con số này nữa"; số dưới đây nói "cái subscription sau socket
  # này đã chết". Đặt ngược lại thì scanner nối lại một sàn mà chính nó vẫn
  # coi là tươi — bão reconnect đội lốt kiểm tra sức khoẻ. Config từ chối
  # nạp nếu số này ≤ `stale_after_sec` của cùng nguồn.
  #
  # ĐO ĐƯỢC 2026-09-12 bằng chính connector production, 13 cặp: khoảng cách
  # lớn nhất giữa hai message CHUẨN HOÁ liên tiếp của một nguồn, tính trên cả
  # socket chứ không theo từng cặp. Hai cửa sổ, trước và sau khi sửa lỗi
  # bybit_spot (PLAN 1.6):
  #
  #   nguồn                20 phút    6 phút
  #   bybit_futures          0,69s    18,38s
  #   okx_futures            6,09s    18,23s
  #   bybit_spot        KHÔNG CÓ      17,59s   ← 0 message trong 20 phút đầu
  #   kraken_futures        10,97s     3,87s
  #   paradex_futures       10,64s     9,00s
  #   gate_futures           7,11s     2,71s
  #   binance_spot           6,60s     2,73s
  #   binance_futures        4,88s     2,77s
  #   hyperliquid_futures    1,65s     1,51s
  #
  # Lý do chọn 600 là CHI PHÍ BẤT ĐỐI XỨNG, không phải một tỉ số. Đặt nhỏ:
  # mất một lần nối lại thừa (một snapshot + một lần đăng ký). Đặt lớn: mất
  # cả cửa sổ feed chết — bybit_spot vừa trả 19 giờ cho cửa sổ vô hạn. Nên
  # nghiêng hẳn về phía an toàn.
  #
  # Đừng đọc "600 ≈ 33× số tệ nhất" như bằng chứng mạnh: chính bybit_futures
  # cho 0,69s ở cửa sổ này và 18,38s ở cửa sổ kia, cách nhau vài phút — biên
  # độ dao động 27×, nên con số tệ nhất KHÔNG ổn định và không phải thứ để
  # siết ngưỡng theo. Một cửa sổ vài chục phút cũng không đo được đuôi: §10
  # DATA-REQUIREMENTS đã ghi Paradex cho 18s sau bốn phút và 71s sau bốn
  # mươi phút. `internal/config` chặn cứng dưới 60s
  # (`MinDataSilenceSec`) vì dưới đó đồng hồ khung 60s của chính socket
  # không bao giờ là cái nổ trước.
  #
  # Chưa khai theo từng nguồn: chín nguồn đo được nằm gọn trong 0,69–18,38s
  # và thứ hạng ĐẢO giữa hai cửa sổ (bybit_futures tệ nhất ở cửa sổ này, tốt
  # nhất ở cửa sổ kia), nên chia chín con số riêng là độ chính xác giả. Khi
  # một sàn chứng minh nó cần số khác, khai `data_silence_sec` ở ngay nguồn đó.
  #
  # `pyth` CŨNG nhận mặc định này từ 2026-09-13. Oracle chạy SSE với vòng đọc
  # riêng, không dùng `runSession`, nên trong một ngày nó được miễn — nhưng
  # `exchanges/pyth` nay có đúng hai đồng hồ đó (khung: mọi dòng; dữ liệu: chỉ
  # dòng sinh ra giá), vì stream Hermes mang cả comment SSE lẫn
  # `data: heartbeat` và một Hermes ngừng công bố giá mà vẫn heartbeat sẽ giữ
  # kết nối mở vô hạn. Đây đúng là chỗ lỗi im lặng ẩn được lâu nhất: Pyth trả
  # 401 suốt 72 giờ soak mà không ai thấy.
  default_data_silence_sec: 600

# Lưu trữ SQLite (Bước 2.6).
#
# Mọi chu kỳ dưới đây là một HỆ SỐ NHÂN SỐ DÒNG, nên chúng nằm ở config chứ
# không phải hằng số trong code: 4 cặp × 9 nguồn lấy mẫu mỗi 5s là khoảng
# 622.000 dòng giá mỗi ngày; để 1s thì gấp năm.
storage:
  # false = scanner chạy y như trước Bước 2.6: không mở file, không ghi gì.
  enabled: true
  path: "data/scanner.db"

  # Chu kỳ lấy mẫu top-of-book, tính bằng giây.
  #
  # ⚠️ ĐO THẬT 2026-09-04 trên đúng schema này: **133,3 byte/dòng**
  # (`MEASURE_STORE=1 go test -run TestPriceSnapshotRowCost ./internal/store/`).
  # Với 36 chuỗi và 90 ngày lưu trữ:
  #     5s  → 56,0 triệu dòng ≈ 7,46 GB
  #    10s  → 28,0 triệu dòng ≈ 3,73 GB
  #    30s  →  9,3 triệu dòng ≈ 1,24 GB   ← đang dùng
  #    60s  →  4,7 triệu dòng ≈ 0,62 GB
  # PLAN 2.6 đề xuất 1–5s khi chưa có số đo. Vị thế funding giữ hàng NGÀY, nên
  # 30s vẫn cho 2.880 mẫu/ngày/chuỗi mà tốn 1/6 dung lượng.
  price_sample_every_sec: 30

  # Bổ sung funding lịch sử từ REST. Mỗi tick hỏi 7 sàn, mà mốc settle nhanh
  # nhất trong hệ là 1 giờ (Kraken, Hyperliquid) — 60 phút là vừa đủ dày.
  #
  # Chi phí đo được mỗi tick: ~30 request, trong đó Kraken luôn trả **cả năm
  # trong một response 1 MB** bất kể cửa sổ (sàn không có phân trang), tức
  # ~4 MB/giờ cho 4 cặp. Đây là kho backtest chứ không phải dữ liệu quyết định,
  # nên nới lên 240 phút hoàn toàn hợp lệ nếu băng thông đáng quan tâm.
  funding_topup_every_min: 60

  # Ảnh chụp quy tắc giao dịch. Khoá theo NGÀY (UTC), nên chụp nhiều lần trong
  # ngày chỉ ghi đè ảnh của ngày đó — 6 giờ để một lần fetch hỏng không xoá
  # trắng ảnh của cả ngày.
  instrument_snapshot_every_hours: 6

  prune_every_hours: 24

  # Thời gian giữ, tính bằng NGÀY. 0 = giữ vĩnh viễn.
  #
  # ⚠️ funding là thứ DUY NHẤT ở đây không lấy lại được: OKX chỉ công bố ~90
  # ngày, Gate 180 ngày. Cắt xuống dưới ngưỡng đó là mất vĩnh viễn, nên config
  # từ chối mọi giá trị từ 1 đến 29.
  retain_funding_days: 365
  retain_price_days: 90

# Độ sâu sổ lệnh (Bước 2.7b). Lấy qua REST theo chu kỳ, KHÔNG stream: vị thế
# funding giữ hàng ngày tới hàng tuần, nên không có lý do biết sổ lệnh đổi từng
# mili-giây. `depth` incremental với sequence number và resync chỉ đáng khi đang
# thực sự đặt lệnh — đó là Bước 4.4. Xem PLAN §7.4.
depth:
  enabled: true

  # Mỗi lượt quét là 1 request/market (4 cặp × 9 nguồn = 36 request). PLAN §7.4
  # đề xuất 1–4 giờ; 60 phút là đầu nhanh của khoảng đó và vẫn 24 mẫu/ngày.
  refresh_every_min: 60

  # Số mức hỏi mỗi phía. Mỗi fetcher tự KẸP xuống trần của sàn nó, nên con số
  # này đọc là "xin sâu nhất có thể".
  #
  # ⚠️ ĐO 2026-09-04 trên BTCUSDT — 100 mức là KHÔNG ĐỦ. Độ trải của sổ trả về,
  # tính theo % quanh mid, ở 100 mức so với trần từng sàn:
  #
  #   binance_futures  100 → 0,017%   1000 → 0,161%   (trần fetcher 1000)
  #   binance_spot     100 → 0,028%   1000 → 0,235%   (sàn cho tới 5000)
  #   bybit_futures    100 → 0,024%    500 → 0,101%   (trần tài liệu 500)
  #   bybit_spot       100 → 0,084%    200 → 0,177%   (trần tài liệu 200)
  #   gate_futures     100 → 0,077%    300 → 0,175%   (400 trả HTTP 400)
  #   okx_futures      100 → 0,024%    400 → 0,077%   (trần cứng, KHÔNG tới 0,1%)
  #   hyperliquid       20 → 0,024%    — cố định 20 mức, không nới được
  #   kraken           cả sổ → 99,99%  — không có tham số limit
  #   paradex          100 → 14,5%     — sổ mỏng nên trải rất rộng
  #
  # Với 100 mức thì 7/9 sàn không chạm nổi cửa sổ hẹp 0,1%, nên gần như mọi con
  # số độ sâu là CẬN DƯỚI và bảng xếp hạng sẽ phản ánh "sàn nào trả nhiều mức
  # nhất" chứ không phải "sàn nào sâu nhất". Đặt 1000 để mỗi sàn cho hết mức nó
  # cho; OKX và Hyperliquid vẫn không tới được và được gắn cờ `covers_0_1pct`.
  levels: 1000

  # Lưu bao lâu. 0 = GIỮ TẤT CẢ.
  #
  # ⚠️ Đây là chuỗi DUY NHẤT không backfill được. Funding lịch sử thì sàn công
  # bố lại sau nhiều tháng; sổ lệnh biến mất ngay khi nó đổi, nên mỗi giờ không
  # ghi là một giờ GĐ 3 vĩnh viễn không mô hình hoá được slippage. Một năm quét
  # theo giờ trên 36 market là ~315k dòng — nhỏ hơn một ngày price sample.
  retain_days: 365

# Các cặp scanner theo dõi.
#
# `base` và `quote` được khai tường minh, không suy ra từ hậu tố chuỗi: suy ra
# kiểu đó là cách "DOGEUSDT" trở thành base "DOG". Chúng dùng để dựng ký hiệu
# riêng của từng sàn qua `symbol_format` bên dưới.
# ─── Bước 3.5: bộ đánh giá tín hiệu SỐNG (chế độ chỉ-ghi-nhật-ký) ───────────
# Cùng bộ tham số cmd/backtest dùng mặc định, để nhật ký tín hiệu sống và
# backtest so được với nhau qua CÙNG cửa sổ. Không đặt lệnh: đây là vị thế
# GIẤY, tiến trình không giữ credential. Mọi ngưỡng là BẮT BUỘC khi bật —
# không có mặc định ngầm, vì một ngưỡng code tự điền là ngưỡng không ai chọn.
# Ghép chân spot với chân perp: KHAI BÁO của người vận hành, không phải dữ kiện
# của sàn. internal/instruments từ chối ghép hai chân khác quote, vì perp quote
# USD đấu với spot quote USDT thì trung tính về coin nhưng CÒN MỞ rủi ro
# USDT/USD — USDT đã từng lệch par vài phần trăm, và không con số nào trong dự
# án này trừ khoản đó. Viết ra đây là cách nhận rủi ro ấy một cách có ý thức;
# bỏ cả khối đi thì quay lại hành vi cũ, chỉ ghép khi hai quote giống hệt.
#
# Khai báo USD ≡ USDT mở khoá 3 sàn perp quote USD (hyperliquid, kraken,
# paradex) — trước đó cả 12 chuỗi của chúng bị loại ở ánh xạ hedge và không
# backtest được. Mọi cặp ghép nhờ khai báo này đều mang cờ QuoteBridged và
# dashboard in cảnh báo ngay trên chân đó.
hedge:
  quote_equivalents:
    - [USD, USDT]

strategy:
  enabled: true
  evaluate_every_min: 10      # funding settle nhanh nhất là 1h; 10 phút là dư
  max_book_age_min: 120       # phải ≥ depth.refresh_every_min, nếu không mọi fill bị coi là cũ
  # Ba ngưỡng thoát đổi theo lưới v7 (2026-09-07, 432 bộ × 24 chuỗi × 12
  # tháng, xem docs/reports/backtest-3.3-wide-2026-09-07.html). Lối VÀO giữ
  # nguyên 0,3/6. Đo trên đúng bộ này: tổng +30,17% trên 24 chuỗi, 18/24
  # chuỗi dương, 1,29 lệnh mỗi chuỗi, sụt vốn tối đa 2,81% — so với +14,82%,
  # 14/24, 4,00 lệnh, 4,06% của bộ trước đó. Đây là bộ ĐẦU TIÊN của dự án
  # vượt mốc chuẩn "giữ suốt cửa sổ, trả một vòng phí" (+29,56%) trên cửa sổ
  # 365 ngày; 72/432 bộ của lưới vượt được, so với 0/4096 của lưới v6.
  # Đọc bảng từng chuỗi trước khi mừng: 20/24 chuỗi chỉ có ĐÚNG 1 lệnh và
  # 18/24 nằm trong 0,10 điểm của giữ suốt, còn phần chênh dương đến từ các
  # chuỗi mà giữ suốt LỖ (SOL·binance +0,98). Nên đây là "giữ suốt cộng một
  # cái cắt lỗ chạy được", không phải một luật kiếm thêm lợi suất. Bộ tốt
  # nhất cả lưới là 0,5/3 với ba ngưỡng thoát y hệt (+30,35%); chênh 0,18
  # điểm không đủ để đổi lối vào mà tiến trình 3.5 đang chạy.
  min_rate_per_8h_bps: 0.3    # ngưỡng rate ĐÃ SETTLE, quy về 8h để so chéo sàn
  persistence_periods: 6      # số mốc settle liên tiếp phải trên ngưỡng
  min_net_apr_frac: 0.02      # APR RÒNG tối thiểu để vào (0.02 = 2%)
  notional_quote: 50000       # vốn mỗi vị thế giấy — slippage tính theo đúng size này
  # holding_days KHÔNG chỉ là một chú thích: NetAPR khấu hao TRỌN chi phí vòng
  # vào đúng con số này (apr.go), nên nó đặt luôn ngưỡng thật của lối vào và
  # của lối thoát suy giảm. Đo được: ở 30 ngày (90 mốc 8h) một mốc phải đạt
  # 0,335 bps/8h thì APR ròng mới ≥ 0 — mà trung bình cả năm của BTC·binance
  # là 0,306 bps/8h, tức mốc TRUNG BÌNH bị chấm là "đang suy giảm" và lối
  # thoát nổ. Ở 90 ngày (270 mốc) ngưỡng đó tụt còn 0,112 bps/8h. Chỉ đổi
  # dòng này 30 → 90, giữ nguyên mọi thứ khác: tổng 24 chuỗi +14,82% → +26,58%,
  # lệnh 4,00 → 2,42, sụt vốn tối đa 4,06% → 2,86%. 180 ngày chỉ thêm +0,3
  # điểm nên 90 là điểm gãy. Con số này cũng khớp thực tế hơn: hoà vốn đo
  # được là 17–18 ngày (hyperliquid BTC/ETH), 33–45 ngày (binance/bybit/
  # kraken), 60–200 ngày trên các chuỗi yếu.
  holding_days: 90            # thời gian giữ dự kiến, để khấu hao chi phí vào/ra
  exit_net_apr_frac: 0        # sàn giữ 0: không thoát vì APR dự phóng tụt
  exit_persistence_periods: 48 # thoát do suy giảm cần N mốc liên tiếp dưới sàn giữ (12 → 48: trung vị lưới 27,02% → 28,87%)
  # Hai ngưỡng basis được hiệu chỉnh trên BTC/ETH. Đo 2026-09-09 trên 13 cặp
  # (docs/reports/backtest-expansion-2026-09-09.html, rồi lưới 624 bộ ở
  # docs/reports/backtest-capital-2026-09-09.html): biên dịch 0,5 điểm nổ 259
  # lần/năm, gần như toàn bộ trên perp USD của kraken cho alt — basis đo được
  # ở đó mang luôn chênh USDT/USD — và làm bộ này LỖ −0,06%/năm trên vốn danh
  # mục 74 chuỗi trong khi giữ suốt được +0,92%. max_basis_widen_pct là trục
  # quyết định (trung bình lưới 0,12% ở 0,5 → 0,30% ở tắt); max_basis_pct gần
  # như không. Bộ đề xuất của lưới: 2,0 / 2,0 với min_hold 1 → +0,87%, hạng
  # 5/624 và 14/624 ở cửa sổ 6 tháng, còn 6 lệnh thoát basis/năm.
  # ÁP DỤNG 2026-09-09 theo quyết định của người vận hành (1,0/0,5 → 2,0/2,0,
  # cùng min_hold_recovered_cost_frac 0 → 1). Đo trên 342 lệnh của bộ cũ, 12
  # tháng, 74 chuỗi × 50k: 259 lệnh thoát basis giữ trung vị 0,9 ngày, trả
  # 71.954 USD phí cho 11.566 USD funding; bộ mới còn 83 lệnh, phí 91.034 →
  # 19.709 USD trên cùng dòng funding. Tiến trình 3.5 đang chạy KHÔNG nhận
  # thay đổi này — nó nạp config một lần lúc khởi động — nên nhật ký của nó
  # vẫn là bộ 2328307; khởi động lại là làm lại 14 ngày.
  max_basis_pct: 2.0          # thoát nếu |perp − spot| vượt mức này
  max_basis_widen_pct: 2.0    # thoát nếu basis dịch xa mức lúc vào hơn mức này
  # Cổng thoát khi funding đảo dấu (thêm 2026-09-07 sau khi đo: đợt âm trên
  # BTC/ETH binance trung vị 1 mốc và 0,3 bps, còn mỗi lần thoát-rồi-vào-lại
  # trả 30 bps). Ba cổng ghép theo AND. 0/1/0 là luật 3.2 cũ — thoát ở BẤT KỲ
  # mốc âm nào — và là thứ tiến trình 3.5 đang chạy vẫn giữ, vì nó nạp config
  # đúng một lần lúc khởi động và không đọc lại file này.
  # Thẩm quyền: mốc ÂM chỉ do lối thoát đảo dấu (ba cổng này) xét; lối thoát
  # suy giảm (exit_net_apr_frac / exit_persistence_periods) chỉ đếm các mốc
  # KHÔNG âm — nếu không, exit_persistence_periods là trần cứng của cả ba cổng
  # (review 2026-09-07).
  exit_negative_min_bps: 2.0       # mốc mới nhất phải ≤ −X bps/8h; đo được: mốc âm sâu nhất của năm là −1,52 nên thực tế là "không thoát vì đảo dấu"
  exit_negative_periods: 2         # N mốc liên tiếp gần nhất đều âm
  # C = 1,0 đọc thành: chỉ rời khi ở lại ĐÃ tốn bằng đúng một vòng phí. Đo
  # trên 24 chuỗi, 12 tháng: đợt âm TỆ NHẤT cả năm vẫn rẻ hơn một vòng trên
  # 19/24 chuỗi (trung vị 0,49×), đợt âm trung vị chỉ tốn 0,0005–0,011% so
  # với vòng 0,30–0,43%. Năm chuỗi vượt 1,0 đều là chuỗi funding âm có hệ
  # thống — SOL·binance 3,21×, SOL·bybit 3,11×, SOL·hyperliquid 2,80×,
  # SOL·kraken 2,02×, XRP·bybit 1,59× — và đó đúng là nơi cổng này nổ.
  exit_negative_cum_cost_frac: 1.0 # funding âm tích luỹ của đợt ≥ C × chi phí vòng
  # Cổng giữ tối thiểu (thêm 2026-09-07): chặn HAI lối thoát vì LỢI SUẤT —
  # đảo dấu và suy giảm — cho tới khi vị thế hoàn lại M lần chi phí vào/ra
  # bằng chính funding nó đã thu. Lối thoát vì RỦI RO (mất chân hedge, basis
  # vượt hạn, không còn định giá được) KHÔNG bao giờ bị chặn. 0 là TẮT, và
  # tắt là đúng luật trước khi khoá này tồn tại.
  # Là PHÂN SỐ của chi phí vòng chứ không phải số mốc: 98 mốc là 33 ngày ở
  # nhịp 8h của Binance nhưng 4 ngày ở nhịp 1h của Hyperliquid, nên một con
  # số mốc duy nhất sẽ là 24 luật khác nhau trên 24 chuỗi.
  # Đo trên lưới v8 (2026-09-07, 1.152 bộ × 24 chuỗi × 12 tháng, so từng cặp
  # cùng bộ nền chỉ khác giá trị cổng này): bật lên cải thiện 239/288 bộ nền,
  # trung bình +105 điểm ở M=1,0 và giảm 14,6 lệnh mỗi chuỗi. Nhưng toàn bộ
  # phần cải thiện đó nằm ở các bộ có luật thoát NHẠY: nhóm X=0 C=0 lỗ khoảng
  # −380 điểm khi không có cổng và được kéo về gần 0 khi có. Trên chính bộ
  # đang ship (X=2 C=1, decay 48 kỳ) trung bình là −0,56 điểm — ba cổng kia đã
  # tắt gần hết hai lối thoát rồi nên không còn gì để chặn. Bộ tốt nhất cả lưới
  # vẫn là M=0 (+30,68%), bộ tốt nhất có cổng là M=2,0 (+30,27%).
  # Kết luận: đây là BẢO HIỂM cho một luật thoát đặt sai, không phải nguồn lợi
  # nhuận. Giữ 0 ở bộ hiện tại; bật khi thử một luật thoát nhạy hơn.
  # Đo lại 2026-09-09 (docs/reports/backtest-hold-2026-09-09.html, 3.200 bộ ×
  # 24 chuỗi × 12 tháng, đổi đúng khoá này từ bộ ship): M=1 nâng tỷ lệ lệnh
  # hoà vốn 56% → 62% và giảm lệnh thoát lợi suất 6 → 2, nhưng lợi nhuận trên
  # vốn +0,562% → +0,542%/năm — 4 lệnh nó chặn đều là lệnh SOL đang lỗ, chặn
  # xong thì giữ tới cuối cửa sổ và lỗ nhiều hơn (SOL·binance −1,12% → −2,15%
  # notional). Tỷ lệ hoà vốn tăng vì mẫu số giảm, không phải vì cứu được lệnh.
  # Bật lên 1 ngày 2026-09-09 cùng với hai ngưỡng basis ở trên: trên lưới 624
  # bộ × 74 chuỗi (docs/reports/backtest-capital-2026-09-09.html) bộ đề xuất
  # là basis 2,0/2,0 VỚI M=1 (+0,872%, hạng 5); cùng ngưỡng basis mà M=0 xếp
  # sau. Ở đây nó là bảo hiểm cho hai lối thoát lợi suất đã gần tắt; phần lợi
  # nhuận nằm ở hai ngưỡng basis.
  min_hold_recovered_cost_frac: 1.0
  # Mô hình ký quỹ chân perp (thêm 2026-09-07). Vị thế trung tính về COIN
  # nhưng chân perp thì KHÔNG: khoản lãi của chân spot nằm ở tài khoản khác,
  # thường ở sàn khác, và ký quỹ không chuyển qua lại được. Một đợt tăng giá
  # có thể thanh lý chân short trong khi vị thế gộp vẫn đứng yên — đây là cách
  # duy nhất chiến lược này mất nhiều hơn phần funding nó đang thu.
  # 0 là TẮT, và tắt là đúng mọi lượt chạy trước khi khoá này tồn tại.
  # perp_margin_frac là ký quỹ đặt trên chân perp theo tỷ lệ notional, tức
  # NGHỊCH ĐẢO đòn bẩy: 0,1 là 10x. Đây là QUYẾT ĐỊNH, không phải dữ kiện sàn —
  # sàn chỉ đặt trần. Đo với biểu duy trì đã xác minh: 10x thanh lý ở khoảng
  # +9,4%, 3x ở +32%, 1x ở +99%.
  #
  # ĐO ĐƯỢC 2026-09-07, 12 tháng, trên CÙNG 16 chuỗi mà lượt có đòn bẩy mở
  # được (binance và hyperliquid bị từ chối vì biểu ký quỹ chưa xác minh).
  #
  # ĐỌC BẢNG CHO ĐÚNG — hai mẫu số, hai câu hỏi khác nhau:
  #  · trên NOTIONAL trả lời "chiến lược có lãi không". Notional KHÔNG đổi khi
  #    bật đòn bẩy, nên cột này đo được CÁI GIÁ của đòn bẩy (các vòng phí do
  #    thanh lý ép ra) và KHÔNG BAO GIỜ đo được cái LỢI.
  #  · trên VỐN trả lời "có nên dùng đòn bẩy không". Chân spot KHÔNG đòn bẩy
  #    được — vẫn phải mua đủ N để hedge — nên vốn = N + f·N, và trần của toàn
  #    bộ lợi ích là 2,00× khi f→0. Không phải 10× ở đòn bẩy 10×.
  #
  # Cột "sau phí" trừ thêm phí thanh lý của sàn (≈ phần ký quỹ duy trì còn lại,
  # 0,30–0,50% notional tuỳ sàn) mà đường equity chưa trừ.
  #
  #   đòn bẩy  thanh lý ở  /notional   vốn   /VỐN   sau phí   vs tắt   trần   liq
  #   tắt      —             +9,49%   2,00×  +4,74%  +4,74%   1,00×   1,00×    0
  #   2x       +49,3%        +9,16%   1,50×  +6,10%  +5,57%   1,17×   1,33×    2
  #   3x       +32,3%        +8,13%   1,33×  +6,12%  +5,51%   1,16×   1,50×    2
  #   5x       +19,4%        +6,83%   1,20×  +5,69%  +4,44%   0,94×   1,67×    4
  #   10x      +9,5%         −2,83%   1,10×  −2,58%  −8,60%     âm    1,82×   18
  #   20x      +4,5%        −19,35%   1,05× −18,43% −25,28%     âm    1,90×   21
  #
  # Toàn bộ phần thưởng là +0,83 điểm ở 2x — 1,17× trên một trần 1,33× — và nó
  # đã âm từ 5x. Đổi lại: 0 → 2 → 4 → 18 → 21 lần thanh lý.
  #
  # KHÔNG trừ phần ký quỹ mất khi bị thanh lý, và đó là CỐ Ý. Một bản trước của
  # ghi chú này nói ngược lại ("18 × 10% = 180% vốn, không ghi ở đâu") và SAI:
  # short chỉ bị thanh lý khi giá TĂNG, nên đúng lúc đó chân spot đang lãi gần
  # đúng bằng phần ký quỹ chân perp mất — chính xác là N(f−m)/(1+m) so với ký
  # quỹ f·N. Vị thế gộp vẫn phẳng. Trừ ký quỹ mà không cộng lãi spot là đếm
  # cùng một cú giá hai lần.
  # Cái THẬT SỰ mất là (a) phí thanh lý, đã ở cột "sau phí", và (b) HEDGE BIẾN
  # MẤT — từ giây đó vị thế là long spot trần trụi cho tới khi bán được, và
  # không con số nào ở đây đo khoảng đó.
  #
  # Kết luận: thưởng tối đa 1,17×, đổi bằng một rủi ro không đo được. Giữ 0.
  # Muốn hiệu quả vốn thật thì để CẢ HAI CHÂN cùng một sàn dùng unified/
  # portfolio margin — lãi spot bù lỗ perp trong cùng tài khoản, nên đạt gần
  # trần 2× mà không thêm rủi ro thanh lý. Đó là quyết định THỰC THI ở phase 4,
  # không phải tham số chiến lược, và hiện chỉ binance có cả hai chân cùng sàn.
  #
  # (Số ở đây đo lại 16:49 với sổ lệnh mới hơn bản 16:34; mọi ô lệch ≤0,07
  # điểm — đúng độ nhạy "một phép đo sổ giữ cố định" mà CLAUDE.md đã ghi.)
  perp_margin_frac: 0
  min_liquidation_buffer_pct: 0
  # Chọn chuỗi theo funding trung bình (thêm 2026-09-09): chỉ mở vị thế trên
  # chuỗi có funding TRUNG BÌNH đã settle qua `trailing_mean_days` ngày gần
  # nhất ≥ `min_trailing_mean_bps` (bps/8h). Đây là luật PHÂN BỔ VỐN — chuỗi
  # nào được nhận vị thế — chứ không phải luật vào lệnh theo mốc: độ bền
  # (persistence_periods) hỏi vài mốc gần nhất có tốt không, còn khoá này hỏi
  # chuỗi đã TRẢ được bao nhiêu qua một chân trời cỡ thời gian giữ. Đo
  # 2026-09-09: chân trời hoà vốn của BTC/ETH là 21–52 ngày, còn 6 chuỗi có
  # funding trung bình dưới chi phí thì không luật thoát nào cứu được; và chĩa
  # đúng bộ này vào riêng BTC+ETH cho lợi nhuận trên vốn gấp đôi ở nửa sụt vốn
  # mà không luật nào trong strategy quyết định điều đó — khoá này là luật đó.
  # Tính theo NGÀY chứ không theo số mốc (quy tắc 3): 270 mốc là 90 ngày ở
  # nhịp 8h nhưng 11 ngày ở nhịp 1h. Lịch sử chưa phủ hết cửa sổ thì TỪ CHỐI,
  # không lấy trung bình ngắn hơn thay thế. 0 là TẮT — đúng luật mọi lượt chạy
  # trước khi khoá này tồn tại, và là thứ tiến trình 3.5 đang chạy.
  min_trailing_mean_bps: 0
  trailing_mean_days: 0
  # Chọn chuỗi theo ĐIỂM CẮT CHI PHÍ CỦA CHÍNH CHUỖI (thêm 2026-09-10, quy
  # luật 2 của docs/reports/regime-3y-2026-09-09.html): funding trung bình qua
  # `trailing_mean_days`, giữ `holding_days` ở đúng nhịp settle của sàn (đếm
  # mốc y như NetAPR), phải trả được `trailing_mean_min_cost_frac` lần vòng
  # phí ĐÃ ĐỊNH GIÁ của chuỗi (phí taker + slippage từ sổ đã lưu; năm khoản
  # chưa trừ của NetAPR vẫn chưa trừ). 1.0 là "đủ trả đúng vòng phí đó" —
  # "không mở chuỗi mà funding trượt chưa trả nổi vòng phí của chính nó".
  # Khác min_trailing_mean_bps ở
  # chỗ ngưỡng là của TỪNG chuỗi: ≈0,33 bps/8h ở BTC/ETH (vòng 0,30%), ≈0,8
  # ở NEAR (0,74%), thay vì một con số chung. Hai sàn có thể bật cùng lúc và
  # cùng dùng trailing_mean_days. 0 là TẮT — đúng luật mọi lượt chạy trước
  # khi khoá này tồn tại, và tái tạo bộ này bit-for-bit (đối chiếu binary).
  # ĐO 2026-09-10 trên bản sao corpus 3 năm, 5 cửa sổ ghim lịch, xếp trên
  # vốn danh mục (docs/reports/costcross-2026-09-10.html): năm 2024–25 (32
  # chuỗi) không bộ k × D nào loại được chuỗi nào — mọi chuỗi đều vượt điểm
  # cắt của mình ở một lúc nào đó, luật chỉ vào MUỘN hơn — tốt nhất +0,003
  # so với bộ này; năm 2025–26 (48 chuỗi) 1,5 × 90 ngày +1,241 so với +1,204
  # nhờ loại đúng 4 chuỗi lỗ (alt kraken), trừ −0,10/chuỗi vào muộn; 1,0 × 90
  # −0,022. Walk-forward chọn TẮT ở 2/3 cặp. Giữ 0: danh sách cặp đã sàng
  # ngày 2026-09-09 (≥ 0,40 bps/8h qua 12 tháng) là một sàng điểm cắt tĩnh
  # rồi; bật (1,5 / 90) khi mở rộng danh sách chưa sàng hoặc khi năm hiện tại
  # có nhóm chuỗi lỗ có hệ thống.
  trailing_mean_min_cost_frac: 0

