<style>

}

*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
:lang(zh) body, body:lang(zh){font-family:"Noto Sans SC","IBM Plex Sans",sans-serif}
a{color:var(--accent)}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.15}
h1{font-size:2rem;font-weight:700;letter-spacing:-.01em}
h2{font-size:1.35rem;font-weight:700}
h3{font-size:1.05rem;font-weight:600}
.eyebrow{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.mono,.num,td.num,th.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.loss{color:var(--loss)} .gain{color:var(--gain)} .warn{color:var(--warn)}
.topbar{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--ground) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--rule)}
.topbar .in{max-width:1040px;margin:0 auto;padding:.6rem 1.25rem;display:flex;align-items:center;gap:1rem;flex-wrap:wrap}
.topbar .name{font-family:var(--display);font-weight:700;font-size:1rem;margin-right:auto}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:999px;padding:2px;gap:2px;background:var(--surface)}
.seg button{border:0;background:transparent;color:var(--muted);font:inherit;font-weight:500;padding:.25rem .7rem;border-radius:999px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{max-width:1040px;margin:0 auto;padding:2rem 1.25rem 4rem;display:grid;gap:3rem}
section{display:grid;gap:1rem}
section>header{display:grid;gap:.35rem;max-width:70ch}
p{margin:0;max-width:70ch}
.verdict{background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:1.5rem;display:grid;gap:1.25rem}
.verdict h1{font-size:clamp(1.5rem,3.2vw,2.3rem)}
.figures{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1rem;border-top:1px solid var(--rule-soft);padding-top:1rem}
.fig{display:grid;gap:.15rem}
.fig .v{font-family:var(--mono);font-size:1.6rem;font-weight:500;line-height:1.1;font-variant-numeric:tabular-nums}
.fig .l{font-size:.8rem;color:var(--muted)}
.note{font-size:.85rem;color:var(--muted);max-width:none}
.legend{display:flex;gap:1.2rem;flex-wrap:wrap;font-size:.8rem;color:var(--muted)}
.legend i{display:inline-block;width:.8em;height:.8em;border-radius:2px;vertical-align:-1px;margin-right:.35em}
.i-loss{background:var(--loss)} .i-gain{background:var(--gain)} .i-accent{background:var(--accent)} .i-warn{background:var(--warn)}
.tablewrap{overflow-x:auto;border:1px solid var(--rule);border-radius:10px;background:var(--surface)}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:.86rem}
th,td{text-align:left;padding:.5rem .7rem;border-bottom:1px solid var(--rule-soft);vertical-align:top;white-space:nowrap}
/* The header stays put while a long table scrolls: 24 series × several
   columns is past the point where a reader can hold the column names. */
th{position:sticky;top:0;z-index:2;background:var(--surface);font-weight:600;color:var(--muted);
   font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;border-bottom:1px solid var(--rule)}
td.num,th.num{text-align:right}
tbody tr:nth-child(even) td{background:color-mix(in srgb,var(--ink) 3%,transparent)}
tbody tr:hover td{background:color-mix(in srgb,var(--accent) 8%,transparent)}
tbody tr:last-child td{border-bottom:0}
td.wrap{white-space:normal;min-width:22ch;max-width:52ch}
/* First column pinned on the wide tables, so a row never loses its name. */
table.pin td:first-child,table.pin th:first-child{position:sticky;left:0;z-index:1;background:var(--surface)}
table.pin tbody tr:nth-child(even) td:first-child{background:color-mix(in srgb,var(--ink) 3%,var(--surface))}
table.pin th:first-child{z-index:3}
/* A cell holding a whole parameter set: one column instead of ten. */
td.params{font-family:var(--mono);font-size:.78rem;color:var(--muted)}
td.params b{color:var(--ink);font-weight:600}
.scrollhint{font-size:.78rem;color:var(--muted);margin-top:.35rem}
.chart{width:100%;overflow-x:auto}
.chart svg{display:block;width:100%;height:auto;font-family:var(--mono);font-size:11px}
.chart .axis{stroke:var(--rule);stroke-width:1}
.chart .grid{stroke:var(--rule-soft);stroke-width:1}
.chart text{fill:var(--muted)}
.chart .bar-loss{fill:var(--loss)} .chart .bar-gain{fill:var(--gain)} .chart .bar-accent{fill:var(--accent)} .chart .bar-warn{fill:var(--warn)}
.chart .marker{stroke:var(--ink);stroke-width:1;stroke-dasharray:3 3}
.chart .marker-text{fill:var(--ink);font-weight:500}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:1.5rem 2rem}
.small h3{margin-bottom:.35rem}
.heat{display:grid;gap:2px;font-family:var(--mono);font-size:.78rem;font-variant-numeric:tabular-nums}
.heat .c{padding:.35rem .4rem;text-align:right;border-radius:3px;min-width:4.5em;line-height:1.2}
.heat .c small{display:block;font-size:.66rem;opacity:.75}
.heat .h{color:var(--muted);text-align:right;padding:.35rem .4rem;font-size:.7rem}
.heat .rh{color:var(--muted);text-align:left;padding:.35rem .4rem;font-size:.7rem}
.heatwrap{overflow-x:auto}
.heat-title{display:flex;justify-content:space-between;gap:1rem;align-items:baseline;flex-wrap:wrap}
.bullets{margin:0;padding-left:1.2rem;display:grid;gap:.5rem;max-width:75ch}
.bullets li::marker{color:var(--accent)}
.assume{background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:1.25rem 1.5rem}
.assume ol{margin:0;padding-left:1.2rem;display:grid;gap:.6rem;max-width:80ch}
pre{margin:0;background:var(--surface);border:1px solid var(--rule);border-radius:8px;padding:1rem;overflow-x:auto;font-family:var(--mono);font-size:.8rem;line-height:1.5}
.pill{display:inline-block;padding:.05rem .5rem;border-radius:999px;font-size:.72rem;font-weight:600;letter-spacing:.03em;border:1px solid currentColor}
.pill.fail,.pill.weak{color:var(--loss)} .pill.pass{color:var(--gain)} .pill.partial{color:var(--warn)} .pill.open{color:var(--muted)}
.tabs{display:flex;gap:.5rem;flex-wrap:wrap}
.tabs button{font:inherit;font-size:.85rem;border:1px solid var(--rule);background:var(--surface);color:var(--ink);padding:.3rem .75rem;border-radius:6px;cursor:pointer}
.tabs button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);font-weight:600}
.tabs button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:.35rem 1.25rem;font-size:.9rem;align-items:baseline}
.pagenav{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:-2rem}
.pagenav a{font-size:.8rem;text-decoration:none;color:var(--muted);border:1px solid var(--rule);background:var(--surface);border-radius:999px;padding:.2rem .7rem}
.pagenav a:hover,.pagenav a:focus-visible{color:var(--accent);border-color:var(--accent)}
.answer{border:1px solid var(--rule);border-radius:12px;overflow:hidden;background:var(--surface)}
.answer .row{display:grid;grid-template-columns:1fr 7.5rem 6rem 6rem;gap:.35rem 1rem;padding:.8rem 1.25rem;border-bottom:1px solid var(--rule-soft);align-items:baseline}
.answer .row:last-child{border-bottom:0}
.answer .row.head{background:color-mix(in srgb,var(--accent) 8%,transparent);font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
.answer .row.head span:not(:first-child){text-align:right}
.answer .who{font-weight:600;font-size:.95rem}
.answer .who small{display:block;font-weight:400;font-size:.8rem;color:var(--muted);line-height:1.4;margin-top:.1rem}
.answer .v{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:1.05rem;text-align:right}
.answer .v.sub{font-size:.9rem;color:var(--muted)}
.answer .v small{display:block;font-size:.72rem;font-weight:400;color:var(--muted);margin-top:.15rem;letter-spacing:.01em}
.answer .row{grid-template-columns:1fr 9.5rem 6rem 6rem}
.gloss{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:1.1rem 2rem;margin:0}
.gloss>div{display:grid;gap:.15rem;align-content:start}
.gloss dt{font-weight:600;font-size:.9rem;margin:0}
.gloss dd{margin:0;font-size:.85rem;color:var(--muted);max-width:48ch}

.kv dt{color:var(--muted);margin:0} .kv dd{margin:0}
footer{font-size:.8rem;color:var(--muted);border-top:1px solid var(--rule);padding-top:1rem}

}

function svg(w, h) { return `<svg viewBox="0 0 ${w} ${h}" role="img">`; }

/* Grouped bars: for each cohort the rule and its own hold-through benchmark,
   both on capital, so the pair is comparable inside a row and across rows. */
function cohortChart(rows) {
  const W0 = 900, rowH = 34, top = 26, left = 210, bot = 28;
  const h = top + rows.length * rowH + bot;
  const vals = rows.flatMap(r => [r.rule, r.ht]).filter(v => v != null);
  const lo = Math.min(0, ...vals), hi = Math.max(0, ...vals);
  const pad = (hi - lo) * 0.12 || 1;
  const x0 = lo - pad, x1 = hi + pad;
  const X = v => left + (v - x0) / (x1 - x0) * (W0 - left - 24);
  let s = svg(W0, h);
  s += `<line class="axis" x1="${X(0)}" y1="${top - 6}" x2="${X(0)}" y2="${top + rows.length * rowH}"/>`;
  rows.forEach((r, i) => {
    const y = top + i * rowH;
    s += `<text x="${left - 10}" y="${y + 16}" text-anchor="end" fill="var(--ink)">${esc(r.label)}</text>`;
    [["rule", "bar-accent", 2], ["ht", "bar-warn", 14]].forEach(([k, c, dy]) => {
      const v = r[k];
      if (v == null) return;
      const a = X(Math.min(0, v)), b = X(Math.max(0, v));
      s += `<rect class="${c}" x="${a}" y="${y + dy}" width="${Math.max(1, b - a)}" height="10" rx="2"/>`;
      s += `<text x="${b + 5}" y="${y + dy + 9}">${pct(v, 2, true)}</text>`;
    });
    s += `<text x="${W0 - 4}" y="${y + 16}" text-anchor="end">${r.n}</text>`;
  });
  s += `<text x="${X(0)}" y="${h - 8}" text-anchor="middle">0</text></svg>`;
  return s;
}

/* One dot per series: the corpus's own funding level against what the rule
   made of it. The vertical line is the level a series needs before a 0.30%
   round trip can be paid back inside a year at K=2. */
function scatterChart(pts, needBps) {
  const W0 = 900, H = 340, left = 56, right = 18, top = 18, bot = 40;
  const xs = pts.map(p => p.x);
  const x0 = Math.min(0, ...xs), x1 = Math.max(...xs, needBps) * 1.05;
  // One series can sit 30 points below the rest (a venue whose basis exit
  // fires every fortnight), and letting it set the scale flattens the other
  // seventy. The axis holds the middle 95%; anything outside is PINNED to
  // the edge as a hollow marker and counted in the caption, never dropped.
  const sorted = pts.map(p => p.y).sort((a, b) => a - b);
  const q = f => sorted[Math.min(sorted.length - 1, Math.max(0, Math.round((sorted.length - 1) * f)))];
  const lo = Math.min(0, q(0.025)), hi = Math.max(q(0.975), 0);
  const padY = (hi - lo) * 0.12 || 0.5;
  const y0 = lo - padY, y1 = hi + padY;
  const X = v => left + (v - x0) / (x1 - x0) * (W0 - left - right);
  const Y = v => H - bot - (Math.min(y1, Math.max(y0, v)) - y0) / (y1 - y0) * (H - top - bot);
  let s = svg(W0, H);
  for (let i = 0; i <= 4; i++) {
    const v = y0 + (y1 - y0) * i / 4;
    s += `<line class="grid" x1="${left}" y1="${Y(v)}" x2="${W0 - right}" y2="${Y(v)}"/>`;
    s += `<text x="${left - 8}" y="${Y(v) + 4}" text-anchor="end">${pct(v, 1)}</text>`;
  }
  s += `<line class="axis" x1="${left}" y1="${Y(0)}" x2="${W0 - right}" y2="${Y(0)}"/>`;
  s += `<line class="marker" x1="${X(needBps)}" y1="${top}" x2="${X(needBps)}" y2="${H - bot}"/>`;
  s += `<text class="marker-text" x="${X(needBps) - 5}" y="${H - bot - 6}" text-anchor="end">${num(needBps, 2)} bps/8h</text>`;
  for (let i = 0; i <= 5; i++) {
    const v = x0 + (x1 - x0) * i / 5;
    s += `<text x="${X(v)}" y="${H - bot + 16}" text-anchor="middle">${num(v, 2)}</text>`;
  }
  s += `<text x="${(left + W0) / 2}" y="${H - 6}" text-anchor="middle">bps/8h</text>`;
  pts.forEach(p => {
    const out = p.y < y0 || p.y > y1;
    const fill = out ? "none" : (p.added ? "var(--accent)" : "var(--gain)");
    s += `<circle cx="${X(p.x)}" cy="${Y(p.y)}" r="4.5" fill="${fill}" fill-opacity=".85" stroke="${p.added ? "var(--accent)" : "var(--gain)"}" stroke-width="${out ? 1.5 : 0}"><title>${esc(p.label)}: ${num(p.x, 3)} bps/8h → ${pct(p.y, 2, true)}${out ? " " + t("sc_pinned") : ""}</title></circle>`;
  });
  pts.filter(p => p.tag).forEach(p => {
    const rightHalf = X(p.x) > left + (W0 - left - right) * 0.7;
    s += `<text x="${X(p.x) + (rightHalf ? -7 : 7)}" y="${Y(p.y) - 8}" text-anchor="${rightHalf ? "end" : "start"}" fill="var(--ink)">${esc(p.label)}</text>`;
  });
  s += "</svg>";
  return s;
}

  el.innerHTML = items.map(i => `<div class="fig"><div class="v ${i.cls || ""}">${i.v}</div><div class="l">${esc(i.l)}</div></div>`).join("");

/* The funding a series must average before a round trip and a 5%/yr target on
   capital are both covered — computed from THIS window's median cost, not
   carried over from another page. */
function needBps(w) {
  const costs = w.series.map(s => s.cost_pct).filter(v => v != null).sort((a, b) => a - b);
  const medCost = costs.length ? costs[Math.floor(costs.length / 2)] : 0.3;
  return (0.05 * w.capital_per_notional + medCost / 100) / 1095 * 1e4;
}

      [{ label: t("th_cohort") }, { label: t("th_n"), num: 1 }, { label: t("cmp_fig_this"), num: 1 },
       { label: t("cmp_fig_other"), num: 1 }, { label: t("th_gap"), num: 1 }, { label: t("th_count"), num: 1 }],
      COHORTS.filter(c => I.cohorts[c]).map(c => {
        const v = I.cohorts[c];
        return [t("co_" + c), num(v.series, 0),
          { v: pct(v.mean_cap_pct, 2, true), cls: cls(v.mean_cap_pct) },
          { v: pct(v.mean_off_pct, 2, true), cls: cls(v.mean_off_pct) },
          { v: pct(v.delta_pct, 2, true), cls: cls(v.delta_pct) },
          `${num(v.trades, 0)} → ${num(v.trades_off, 0)}`];
      }));
    const ser = tbl(
      [{ label: t("th_series") }, { label: t("cmp_fig_this"), num: 1 }, { label: t("cmp_fig_other"), num: 1 },
       { label: t("th_gap"), num: 1 }, { label: t("th_count"), num: 1 }],
      I.series.slice(0, 10).map(r => [sname(r.symbol, r.perp),
        { v: pct(r.cap_pct, 2, true), cls: cls(r.cap_pct) },
        { v: pct(r.cap_off_pct, 2, true), cls: cls(r.cap_off_pct) },
        { v: pct(r.delta_pct, 2, true), cls: cls(r.delta_pct) },
        `${num(r.trades, 0)} → ${num(r.trades_off, 0)}`]));
    const read = t("cmp_read", {
      what: label(I), delta: pct(all.delta_pct, 2, true), on: num(I.trades, 0), off: num(I.trades_off, 0), moved: num(I.moved, 0),
      series: worst ? sname(worst.symbol, worst.perp) : "—",
      sdelta: worst ? pct(worst.delta_pct, 2, true) : "—",
      strades: worst ? `${num(worst.trades, 0)} → ${num(worst.trades_off, 0)}` : "—",
      bridged: pct((I.cohorts.bridged || {}).delta_pct, 2, true),
      usdt: pct((I.cohorts.usdt_quoted || {}).delta_pct, 2, true) });
    return `<div style="display:grid;gap:1rem">
      <h3 style="margin:0">${i + 1}. ${esc(label(I))}<br><span class="muted params" style="font-weight:400;font-size:.82rem">${esc(t("cmp_set"))} ${esc(fmtSet(I.params))}</span></h3>
      <div class="figures">${figs.map(f => `<div class="fig"><div class="v ${f.cls || ""}">${f.v}</div><div class="l">${esc(f.l)}</div></div>`).join("")}</div>
      <div class="grid2">
        <div class="small"><h3>${esc(t("cmp_coh_h"))}</h3><div class="tablewrap"><table>${coh}</table></div></div>
        <div class="small"><h3>${esc(t("cmp_ser_h"))}</h3><div class="tablewrap"><table>${ser}</table></div></div>
      </div>
      <p class="note">${esc(read)}</p>
    </div>`;
  }).join("") : `<p class="note">${esc(t("cmp_none"))}</p>`;
}

function renderGrid() {
  const S = DATA.sweep, box = document.getElementById("grid");
  if (!S) { box.hidden = true; return; }
  box.hidden = false;
  document.getElementById("grIntro").textContent = t("gr_intro", {
    sets: num(S.sets, 0), series: S.series, window: t("w" + S.window), dropped: num(S.dropped_partial, 0) });
  const rows = [
    { who: t("gr_shipped"), sub: fmtSet(DATA.shipped), row: S.shipped },
    { who: t("gr_best"), sub: S.best ? fmtSet(S.best) : "", row: S.best },
  ];
  document.getElementById("grAnswer").innerHTML =
    `<div class="row head"><span>${t("th_set")}</span><span>${t("th_rule")}</span><span>${t("th_trades")}</span><span>${t("th_rank")}</span></div>` +
    rows.filter(r => r.row).map(r => `<div class="row"><div class="who">${esc(r.who)}<small>${esc(r.sub)}</small></div>` +
      `<div class="v ${cls(r.row.mean_cap_pct)}">${pct(r.row.mean_cap_pct, 2, true)}<small>${r.row.positive}/${r.row.series} ${t("fig_positive").toLowerCase()}</small></div>` +
      `<div class="v sub">${num(r.row.trades_per_series, 1)}</div>` +
      `<div class="v sub">${num(r.row.rank, 0)}</div></div>`).join("") +
    (S.ht_mean_cap_pct == null ? "" : `<div class="row"><div class="who">${t("gr_ht")}<small>${t("gr_ht_sub")}</small></div>` +
      `<div class="v ${cls(S.ht_mean_cap_pct)}">${pct(S.ht_mean_cap_pct, 2, true)}</div><div class="v sub">1,0</div><div class="v sub">—</div></div>`);
  document.getElementById("grRead").textContent = t("gr_read", {
    rank: num(S.shipped ? S.shipped.rank : 0, 0), sets: num(S.sets, 0),
    gap: S.shipped && S.best ? num(S.best.mean_cap_pct - S.shipped.mean_cap_pct, 3) : "—",
    beat: num(S.beat_ht, 0), positive: num(S.positive_sets, 0),
    median: pct(S.median_cap_pct, 2, true) });
  const cards = [];
  for (const a of AXES) {
    const m = S.marginals[a];
    if (!m || m.length < 2) continue;
    cards.push(`<div class="small"><h3>${SHORT[a]} — <span class="muted" style="font-weight:400">${esc(a)}</span></h3>` +
      `<div class="tablewrap"><table>` + tbl(
        [{ label: t("th_value"), num: 1 }, { label: t("th_sets"), num: 1 }, { label: t("th_mean"), num: 1 },
         { label: t("th_best"), num: 1 }, { label: t("th_trades"), num: 1 }, { label: t("th_be"), num: 1 },
         { label: t("r_sign_flip"), num: 1 }, { label: t("r_decay"), num: 1 }],
        m.map(v => [g(v.value), num(v.n, 0),
          { v: pct(v.mean_cap_pct, 2, true), cls: cls(v.mean_cap_pct) },
          { v: pct(v.best_cap_pct, 2, true), cls: cls(v.best_cap_pct) },
          num(v.trades_per_series, 1),
          v.be_share == null ? "—" : pct(v.be_share * 100, 0),
          v.flip_share == null ? "—" : pct(v.flip_share * 100, 0),
          v.decay_share == null ? "—" : pct(v.decay_share * 100, 0)])) +
      `</table></div></div>`);
  }
  document.getElementById("mgGrid").innerHTML = cards.join("");
  document.getElementById("topTable").innerHTML = tbl(
    [{ label: t("th_rank"), num: 1 }, { label: t("th_set") }, { label: t("th_rule"), num: 1 },
     { label: t("th_pos"), num: 1 }, { label: t("th_trades"), num: 1 }, { label: t("th_dd"), num: 1 },
     { label: t("th_calmar"), num: 1 }, { label: t("th_be"), num: 1 }],
    S.top.map(r => [num(r.rank, 0), { v: fmtSet(r), cls: "params" },
      { v: pct(r.mean_cap_pct, 2, true), cls: cls(r.mean_cap_pct) },
      `${r.positive}/${r.series}`, num(r.trades_per_series, 1),
      r.mean_dd_cap_pct == null ? "—" : pct(r.mean_dd_cap_pct, 2),
      r.calmar == null ? "—" : num(r.calmar, 2),
      r.be_share == null ? "—" : pct(r.be_share * 100, 0)]));
}

function renderMethod() {
  const w = W();
  const bridged = w.series.filter(s => s.quote_bridged).length;
  const shortCov = w.series.filter(s => s.coverage_short).length;
  const noBasis = w.series.filter(s => s.basis_not_evaluable > 0).length;
  const items = [
    t("me_1", { k: num(w.capital_per_notional, 1) }),
    t("me_2"),
    t("me_3", { n: w.series.length, from: day(w.from_ms), to: day(w.to_ms), days: num(w.days, 0) }),
    t("me_4", { refused: w.refused.length }),
    t("me_5", { short: shortCov }),
    t("me_6", { bridged: bridged }),
    t("me_7", { nobasis: noBasis }),
    t("me_8"),
    t("me_9"),
  ];
  document.getElementById("meList").innerHTML = items.map(x => `<li>${esc(x)}</li>`).join("");
  document.getElementById("mePre").textContent = w.assumptions_vi;
  const gl = [["gl_cap", "gl_cap_d"], ["gl_ht", "gl_ht_d"], ["gl_calmar", "gl_calmar_d"],
    ["gl_bps", "gl_bps_d"], ["gl_bridge", "gl_bridge_d"], ["gl_set", "gl_set_d"]];
  document.getElementById("meGloss").innerHTML = gl.map(([k, d]) =>
    `<div><dt>${esc(t(k))}</dt><dd>${esc(t(d))}</dd></div>`).join("");
  document.getElementById("footText").textContent = t("foot", META);
}

function render() {
  renderStatic();
  document.getElementById("windowLabel").textContent = t("win_label", {
    from: day(W().from_ms), to: day(W().to_ms), n: W().series.length });
  renderVerdict(); renderWhere(); renderRegime(); renderSymbols(); renderSeries(); renderTrades(); renderCmp(); renderGrid(); renderMethod();
}

  `<button type="button" data-win="${k}"></button>`).join("");
document.querySelectorAll("#windowSeg button").forEach(b => b.onclick = () => { win = b.dataset.win; render(); });
document.querySelectorAll("#langSeg button").forEach(b => b.onclick = () => { lang = b.dataset.lang; render(); });
render();
</script>
