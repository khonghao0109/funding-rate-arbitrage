function svg(w, h) { return `<svg viewBox="0 0 ${w} ${h}" role="img">`; }

function lineChart(series, from_ms, to_ms) {
  const W0 = 900, H = 320, left = 56, right = 16, top = 14, bot = 34;
  const ys = series.flatMap(s => s.curve.map(p => p[1]));
  const lo = Math.min(0, ...ys), hi = Math.max(0, ...ys);
  const pad = (hi - lo) * 0.08 || 0.5;
  const y0 = lo - pad, y1 = hi + pad;
  const X = ms => left + (ms - from_ms) / (to_ms - from_ms) * (W0 - left - right);
  const Y = v => H - bot - (v - y0) / (y1 - y0) * (H - top - bot);
  let s = svg(W0, H);
  for (let i = 0; i <= 4; i++) {
    const v = y0 + (y1 - y0) * i / 4;
    s += `<line class="grid" x1="${left}" y1="${Y(v)}" x2="${W0 - right}" y2="${Y(v)}"/>`;
    s += `<text x="${left - 8}" y="${Y(v) + 4}" text-anchor="end">${pct(v, 2)}</text>`;
  }
  s += `<line class="axis" x1="${left}" y1="${Y(0)}" x2="${W0 - right}" y2="${Y(0)}"/>`;
  for (let d = new Date(from_ms); d.getTime() < to_ms; d.setUTCMonth(d.getUTCMonth() + 1)) {
    const m = Date.UTC(d.getUTCFullYear(), d.getUTCMonth() + 1, 1);
    if (m < to_ms) s += `<text x="${X(m)}" y="${H - bot + 16}" text-anchor="middle">${new Date(m).toISOString().slice(0, 7)}</text>`;
  }
  series.forEach(sr => {
    if (!sr.curve.length) return;
    const d = sr.curve.map((p, i) => `${i ? "L" : "M"}${X(p[0]).toFixed(1)},${Y(p[1]).toFixed(1)}`).join("");
    s += `<path class="${sr.cls}" d="${d}"/>`;
    const last = sr.curve[sr.curve.length - 1];
    s += `<text x="${Math.min(X(last[0]) + 4, W0 - 60)}" y="${Y(last[1]) + 4 + (sr.dy || 0)}" fill="var(--ink)">${pct(last[1], 2, true)}</text>`;
  });
  return s + "</svg>";
}

/* Every set as a point: portfolio drawdown against return, both on the
   universe's capital; hold-through as the one hollow diamond. */
function frontierChart(pts, ht) {
  const W0 = 900, H = 340, left = 56, right = 18, top = 16, bot = 40;
  const xs = pts.map(p => p[1]).concat([ht.dd]), ys = pts.map(p => p[0]).concat([ht.ret]);
  const x1 = Math.max(...xs) * 1.06 || 1, y0 = Math.min(0, ...ys) * 1.1, y1 = Math.max(...ys) * 1.08 || 1;
  const X = v => left + v / x1 * (W0 - left - right);
  const Y = v => H - bot - (v - y0) / (y1 - y0) * (H - top - bot);
  let s = svg(W0, H);
  for (let i = 0; i <= 4; i++) {
    const v = y0 + (y1 - y0) * i / 4;
    s += `<line class="grid" x1="${left}" y1="${Y(v)}" x2="${W0 - right}" y2="${Y(v)}"/><text x="${left - 8}" y="${Y(v) + 4}" text-anchor="end">${pct(v, 2)}</text>`;
  }
  for (let i = 0; i <= 5; i++) {
    const v = x1 * i / 5;
    s += `<text x="${X(v)}" y="${H - bot + 16}" text-anchor="middle">${pct(v, 2)}</text>`;
  }
  s += `<line class="axis" x1="${left}" y1="${Y(0)}" x2="${W0 - right}" y2="${Y(0)}"/>`;
  s += `<text x="${(left + W0) / 2}" y="${H - 6}" text-anchor="middle">${esc(t("th_pfdd"))}</text>`;
  pts.forEach(p => {
    s += `<circle cx="${X(p[1])}" cy="${Y(p[0])}" r="3.5" fill="${p[3] ? "var(--accent)" : "var(--gain)"}" fill-opacity=".7"><title>${pct(p[0], 3, true)} / dd ${pct(p[1], 3)} · ${p[2]} series · widen ${p[4]}</title></circle>`;
  });
  s += `<path d="M${X(ht.dd)},${Y(ht.ret) - 7} l7,7 l-7,7 l-7,-7 z" fill="none" stroke="var(--warn)" stroke-width="2"><title>hold-through</title></path>`;
  return s + "</svg>";
}

  const w = W(), R = REC(), B = w.best, S = w.shipped, HT = w.hold_through, gv = w.grid_values;
  document.getElementById("vHeadline").textContent = t("v_head", {
    rec: pct(R.row.mean_cap_pct, 2, true), ship: S ? pct(S.row.mean_cap_pct, 2, true) : "—", ht: pct(HT.mean_cap_pct, 2, true),
    verb: t(R.row.mean_cap_pct > HT.mean_cap_pct ? "v_verb_above" : "v_verb_below") });
  document.getElementById("vLede").textContent = t("v_lede", {
    sets: num(w.sets, 0), n: w.series, refused: w.refused, from: day(w.from_ms), to: day(w.to_ms),
    sel: `${gv.min_trailing_mean_bps.map(g).join("/")} bps · ${gv.trailing_mean_days.map(g).join("/")} ${lang === "zh" ? "天" : "ngày"}`,
    basis: `${gv.max_basis_pct.map(g).join("/")} · ${gv.max_basis_widen_pct.map(g).join("/")}` });
  figures(document.getElementById("vFigures"), [
    { v: pct(R.row.mean_cap_pct, 2, true), l: t("fig_rec"), cls: cls(R.row.mean_cap_pct) },
    { v: pct(B.row.mean_cap_pct, 2, true), l: t("fig_best"), cls: cls(B.row.mean_cap_pct) },
    { v: pct(HT.mean_cap_pct, 2, true), l: t("fig_ht"), cls: cls(HT.mean_cap_pct) },
    { v: S ? pct(S.row.mean_cap_pct, 2, true) : "—", l: t("fig_ship"), cls: S ? cls(S.row.mean_cap_pct) : "" },
    { v: pct(R.portfolio.max_dd_cap_pct, 2), l: t("fig_pfdd") },
    { v: S ? `${S.row.rank}/${w.sets}` : "—", l: t("fig_shiprank") },
    { v: `${w.stats.beat_ht}/${w.sets}`, l: t("fig_beat") },
  ]);
  const cr = crossOf("guarded") || crossOf("best");
  document.getElementById("vNote").textContent = t("v_note", {
    guard: `${g(R.params.max_basis_pct)} / ${g(R.params.max_basis_widen_pct)}`,
    price: num(B.row.mean_cap_pct - R.row.mean_cap_pct, 3), rank: R.row.rank,
    cross: cr && cr.rank != null ? `${cr.rank}/${DATA.windows[cr.other].sets}` : "—" });
}

function renderAnswer() {
  const w = W(), HT = w.hold_through;
  const rows = [];
  if (w.shipped) rows.push({ who: t("who_ship"), b: w.shipped });
  rows.push({ who: t("who_best"), b: w.best });
  if (w.guarded) rows.push({ who: t("who_guarded"), b: w.guarded });
  if (w.selection_best_block) rows.push({ who: t("who_sel"), b: w.selection_best_block });
  const head = [{ label: t("th_who") }, { label: t("th_pf"), num: 1 }, { label: t("th_dep"), num: 1 }, { label: t("th_traded"), num: 1 },
    { label: t("th_pos"), num: 1 }, { label: t("th_pfdd"), num: 1 }, { label: t("th_pfcalmar"), num: 1 },
    { label: t("th_beat"), num: 1 }, { label: t("th_hton"), num: 1 }, { label: t("th_trades"), num: 1 }, { label: t("th_rank"), num: 1 }];
  const body = rows.map(({ who, b }) => {
    const r = b.row;
    return [`${esc(who)}<br><span class="muted mono" style="font-size:.75rem">${esc(fmtSet(b.params))}</span>`,
      { v: pct(r.mean_cap_pct, 2, true), cls: cls(r.mean_cap_pct) },
      { v: pct(r.deployed_cap_pct, 2, true), cls: cls(r.deployed_cap_pct) },
      `${r.traded_series}/${w.series}`, `${r.positive}/${r.series}`, pct(r.pf_dd_cap_pct, 3),
      r.pf_calmar == null ? "—" : num(r.pf_calmar, 2),
      `${r.beat_ht}/${w.series}`, { v: pct(r.ht_on_traded_cap_pct, 2, true), cls: cls(r.ht_on_traded_cap_pct) },
      num(r.trades_per_series, 2), num(r.rank, 0)];
  });
  body.push([`${esc(t("who_ht"))}`,
    { v: pct(HT.mean_cap_pct, 2, true), cls: cls(HT.mean_cap_pct) }, { v: pct(HT.mean_cap_pct, 2, true), cls: cls(HT.mean_cap_pct) },
    `${w.series}/${w.series}`, `${HT.positive}/${w.series}`, pct(HT.portfolio.max_dd_cap_pct, 3),
    HT.portfolio.pf_calmar == null ? "—" : num(HT.portfolio.pf_calmar, 2), "—", "—", "1,00", "—"]);
  document.getElementById("anTable").innerHTML = tbl(head, body);
  const Sb = w.selection_best_block;
  document.getElementById("anRead").textContent = Sb ? t("an_read", {
    traded: Sb.row.traded_series, n: w.series, dep: pct(Sb.row.deployed_cap_pct, 2, true), pf: pct(Sb.row.mean_cap_pct, 2, true),
    idle: w.series - Sb.row.traded_series, hton: pct(Sb.row.ht_on_traded_cap_pct, 2, true),
    timing: num(Sb.row.ht_on_traded_cap_pct - Sb.row.deployed_cap_pct, 2),
    shiprank: w.shipped ? num(w.shipped.row.rank, 0) : "—", sets: num(w.sets, 0) }) : "";
}

function renderSet() {
  const w = W(), ship = DATA.shipped, R = REC(), best = w.best.row;
  const whyOf = k => k.startsWith("min_trailing") || k.startsWith("trailing") ? t("why_sel")
    : k.startsWith("max_basis") ? t("why_basis") : k === "min_hold_recovered_cost_frac" ? t("why_hold")
    : k === "min_rate_per_8h_bps" ? t("why_rate") : t("why_same");
  const changed = [];
  let html = `<div class="diffline head"><span>${t("th_key")}</span><span>${t("th_ship")}</span><span>${t("th_best")}</span><span>${t("th_why")}</span></div>`;
  YAML_KEYS.forEach(k => {
    const a = ship[k], b = R.params[k];
    const diff = Math.abs((a ?? 0) - (b ?? 0)) > 1e-9;
    if (diff) changed.push(k);
    html += `<div class="diffline ${diff ? "changed" : ""}"><span>${esc(k)}</span><span>${g(a)}</span><span><b>${g(b)}</b></span><span class="why">${esc(diff ? whyOf(k) : t("why_same"))}</span></div>`;
  });
  document.getElementById("setDiff").innerHTML = html;
  document.getElementById("setRead").textContent = t("set_read", { set: fmtSet(R.params), changed: changed.length ? changed.join(", ") : "—",
    best: pct(best.mean_cap_pct, 2, true), price: num(best.mean_cap_pct - R.row.mean_cap_pct, 3) });
}

function renderPortfolio() {
  const w = W(), R = REC();
  const series = [];
  if (w.shipped) series.push({ cls: "line-ship", curve: w.shipped.portfolio.curve, dy: 12 });
  series.push({ cls: "line-ht", curve: w.hold_through.portfolio.curve, dy: -10 });
  if (w.selection_best_block) series.push({ cls: "line-calmar", curve: w.selection_best_block.portfolio.curve, dy: 12 });
  series.push({ cls: "line-rule", curve: R.portfolio.curve });
  document.getElementById("pfChart").innerHTML = lineChart(series, w.from_ms, w.to_ms);
  document.getElementById("pfLegend").innerHTML =
    `<span><i class="i-accent"></i>${t("lg_rec")}</span>` + (w.shipped ? `<span><i style="background:var(--muted)"></i>${t("lg_ship")}</span>` : "") +
    `<span><i class="i-warn"></i>${t("lg_ht")}</span>` + (w.selection_best_block ? `<span><i class="i-gain"></i>${t("lg_sel")}</span>` : "");
  document.getElementById("pfIntro").textContent = t("pf_p", { sets: num(w.sets, 0) });
  const P = R.portfolio;
  figures(document.getElementById("pfFigures"), [
    { v: pct(P.final_cap_pct, 2, true), l: t("fig_pf_final"), cls: cls(P.final_cap_pct) },
    { v: pct(P.max_dd_cap_pct, 3), l: t("fig_pf_dd") },
    { v: `${P.max_concurrent}/${w.series}`, l: t("fig_conc") },
    { v: day(P.first_entry_ms), l: t("fig_first") },
  ]);
  document.getElementById("pfRead").textContent = t("pf_read", {
    final: pct(P.final_cap_pct, 2, true), dd: pct(P.max_dd_cap_pct, 3),
    shipdd: w.shipped ? pct(w.shipped.portfolio.max_dd_cap_pct, 3) : "—", htdd: pct(w.hold_through.portfolio.max_dd_cap_pct, 3),
    conc: P.max_concurrent, n: w.series });
}

function renderFrontier() {
  const w = W(), HT = w.hold_through;
  document.getElementById("frChart").innerHTML = frontierChart(w.scatter, { ret: HT.mean_cap_pct, dd: HT.portfolio.max_dd_cap_pct });
  const head = [{ label: t("th_budget"), num: 1 }, { label: t("th_inside"), num: 1 }, { label: t("th_bestin"), num: 1 },
    { label: t("th_pfdd"), num: 1 }, { label: t("th_ratio"), num: 1 }, { label: t("th_traded"), num: 1 }, { label: t("th_set") }];
  document.getElementById("frTable").innerHTML = tbl(head, w.frontier.map(f => [pct(f.budget_pct, 2), num(f.sets_inside, 0),
    { v: pct(f.row.mean_cap_pct, 3, true), cls: cls(f.row.mean_cap_pct) }, pct(f.row.pf_dd_cap_pct, 3),
    f.row.pf_calmar == null ? "—" : num(f.row.pf_calmar, 2), `${f.row.traded_series}/${w.series}`, { v: fmtSet(f.params), cls: "params" }]));
  const fr = w.frontier;
  const free = fr.find(f => !f.row.selection_on) || fr[fr.length - 1];
  const mid = fr[Math.min(3, fr.length - 1)];
  document.getElementById("frRead").textContent = fr.length ? t("fr_read", {
    b0: pct(fr[0].budget_pct, 2), r0: pct(fr[0].row.mean_cap_pct, 2, true), t0: fr[0].row.traded_series, n: w.series,
    c0: fr[0].row.pf_calmar == null ? "—" : num(fr[0].row.pf_calmar, 1),
    b1: pct(mid.budget_pct, 2), r1: pct(mid.row.mean_cap_pct, 2, true), t1: mid.row.traded_series,
    bfree: pct(free.budget_pct, 2), rfree: pct(free.row.mean_cap_pct, 2, true) }) : "";
}

function renderWhere() {
  const w = W(), R = REC();
  const picked = R.per_series.filter(s => s.trades > 0);
  document.getElementById("whIntro").textContent = t("wh_intro", { traded: picked.length, n: w.series });
  document.getElementById("whChips").innerHTML = picked.map(s =>
    `<span class="chip">${esc(sname(s.symbol, s.perp))}${s.quote_bridged ? " ⇄" : ""} <b class="${cls(s.cap_pct)}">${pct(s.cap_pct, 2, true)}</b></span>`).join("");
  const head = [{ label: t("th_cohort") }, { label: t("th_n"), num: 1 }, { label: t("th_traded"), num: 1 }, { label: t("th_rule"), num: 1 },
    { label: t("th_ht"), num: 1 }, { label: t("th_gap"), num: 1 }, { label: t("th_dd"), num: 1 }, { label: t("th_calmar"), num: 1 }, { label: t("th_worst"), num: 1 }];
  const coh = COHORTS.filter(c => R.cohorts[c] && R.cohorts[c].series);
  document.getElementById("whTable").innerHTML = tbl(head, coh.map(c => {
    const v = R.cohorts[c], gap = v.mean_cap_pct - v.ht_mean_cap_pct;
    return [t("co_" + c), num(v.series, 0), num(v.traded, 0),
      { v: pct(v.mean_cap_pct, 2, true), cls: cls(v.mean_cap_pct) }, { v: pct(v.ht_mean_cap_pct, 2, true), cls: cls(v.ht_mean_cap_pct) },
      { v: pct(gap, 2, true), cls: cls(gap) }, pct(v.mean_dd_cap_pct, 2), v.calmar == null ? "—" : num(v.calmar, 2),
      { v: pct(v.worst_cap_pct, 2, true), cls: cls(v.worst_cap_pct) }];
  }));
  const bestc = coh.filter(c => c !== "all").sort((a, b) => R.cohorts[b].mean_cap_pct - R.cohorts[a].mean_cap_pct)[0];
  const worst = picked.length ? picked[picked.length - 1] : null;
  document.getElementById("whRead").textContent = t("wh_read", {
    bridged: picked.filter(s => s.quote_bridged).length, usdt: picked.filter(s => !s.quote_bridged).length,
    bestc: bestc ? t("co_" + bestc) : "—", bestv: bestc ? pct(R.cohorts[bestc].mean_cap_pct, 2, true) : "—",
    worst: worst ? sname(worst.symbol, worst.perp) : "—", worstv: worst ? pct(worst.cap_pct, 2, true) : "—" });
}

function renderAxes() {
  const w = W(), cards = [], spans = [];
  for (const a of CAP_AXES) {
    const m = w.marginals[a];
    if (!m) continue;
    const means = m.map(v => v.mean_cap_pct);
    spans.push({ a, span: Math.max(...means) - Math.min(...means) });
    cards.push(`<div class="small"><h3>${SHORT[a]} — <span class="muted" style="font-weight:400">${esc(a)}</span></h3><div class="tablewrap"><table>` +
      tbl([{ label: t("th_value"), num: 1 }, { label: t("th_sets"), num: 1 }, { label: t("th_mean"), num: 1 }, { label: t("th_best_col"), num: 1 },
           { label: t("th_trades"), num: 1 }, { label: t("th_be"), num: 1 }, { label: t("th_flip"), num: 1 }, { label: t("th_decay"), num: 1 }],
        m.map(v => [g(v.value), num(v.n, 0), { v: pct(v.mean_cap_pct, 2, true), cls: cls(v.mean_cap_pct) },
          { v: pct(v.best_cap_pct, 2, true), cls: cls(v.best_cap_pct) }, num(v.trades_per_series, 1),
          v.be_share == null ? "—" : pct(v.be_share * 100, 0), v.flip_share == null ? "—" : pct(v.flip_share * 100, 0),
          v.decay_share == null ? "—" : pct(v.decay_share * 100, 0)])) + `</table></div></div>`);
  }
  document.getElementById("mgGrid").innerHTML = cards.join("");
  spans.sort((x, y) => y.span - x.span);
  document.getElementById("axRead").textContent = spans.length ? t("ax_read", {
    axis: spans[0].a, span: num(spans[0].span, 2), flat: spans[spans.length - 1].a, flatspan: num(spans[spans.length - 1].span, 3) }) : "";
}

function renderRobust() {
  const w = W();
  const lines = [];
  for (const [which, who] of [["best", "who_best"], ["guarded", "who_guarded"], ["selection_best_block", "who_sel"]]) {
    const c = crossOf(which);
    if (c && c.rank != null) lines.push(t("rb_cross", { who: t(who), a: t("w" + win), b: t("w" + c.other), r: num(c.rank, 0), sets: num(DATA.windows[c.other].sets, 0) }));
  }
  document.getElementById("rbIntro").textContent = t("rb_intro", { cross: lines.join(" ") });
  const head = [{ label: t("th_rank"), num: 1 }, { label: t("th_set") }, { label: t("th_pf"), num: 1 }, { label: t("th_dep"), num: 1 },
    { label: t("th_traded"), num: 1 }, { label: t("th_pfdd"), num: 1 }, { label: t("th_pfcalmar"), num: 1 }, { label: t("th_trades"), num: 1 }];
  const row = r => [num(r.rank, 0), { v: fmtSet(r), cls: "params" },
    { v: pct(r.mean_cap_pct, 2, true), cls: cls(r.mean_cap_pct) }, { v: pct(r.deployed_cap_pct, 2, true), cls: cls(r.deployed_cap_pct) },
    `${r.traded_series}/${w.series}`, pct(r.pf_dd_cap_pct, 3), r.pf_calmar == null ? "—" : num(r.pf_calmar, 2), num(r.trades_per_series, 2)];
  document.getElementById("topTable").innerHTML = tbl(head, w.top.slice(0, 15).map(row));
  document.getElementById("calmarTable").innerHTML = tbl(head, w.selection_best_deployed.slice(0, 10).map(row));
}

function renderMethod() {
  const w = W(), R = REC();
  const bridged = R.per_series.filter(s => s.quote_bridged && s.trades > 0).length;
  const items = [t("me_1", { k: num(w.capital_per_notional, 1), n: w.series }), t("me_2"),
    t("me_3", { n: w.series, dropped: num(w.dropped_partial, 0) }), t("me_4"),
    t("me_5", { bridged_note: lang === "zh" ? `${bridged} 条被选序列为跨报价配对，其基差含 USDT/USD 价差。` : `${bridged} chuỗi có lệnh là ghép cầu, basis đo được mang cả chênh USDT/USD.` }),
    t("me_6"), t("me_7")];
  document.getElementById("meList").innerHTML = items.map(x => `<li>${esc(x)}</li>`).join("");
  const gl = [["gl_pf", "gl_pf_d"], ["gl_dep", "gl_dep_d"], ["gl_sel", "gl_sel_d"], ["gl_guard", "gl_guard_d"], ["gl_pfdd", "gl_pfdd_d"]];
  document.getElementById("meGloss").innerHTML = gl.map(([k, d]) => `<div><dt>${esc(t(k))}</dt><dd>${esc(t(d))}</dd></div>`).join("");
  document.getElementById("footText").textContent = t("foot", META);
}

function render() {
  renderStatic();
  document.getElementById("windowLabel").textContent = t("win_label", { from: day(W().from_ms), to: day(W().to_ms), n: W().series, sets: num(W().sets, 0) });
  renderVerdict(); renderAnswer(); renderSet(); renderPortfolio(); renderFrontier(); renderWhere(); renderAxes(); renderRobust(); renderMethod();
}
document.getElementById("windowSeg").innerHTML = WINS.map(k => `<button type="button" data-win="${k}"></button>`).join("");
document.querySelectorAll("#windowSeg button").forEach(b => b.onclick = () => { win = b.dataset.win; render(); });
document.querySelectorAll("#langSeg button").forEach(b => b.onclick = () => { lang = b.dataset.lang; render(); });
render();
</script>
