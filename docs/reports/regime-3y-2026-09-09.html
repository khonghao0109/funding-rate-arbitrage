      `${setLabel(p.test_best)} ${pct(p.test_best.mean_cap_pct, 2, true)}`, p.applied_on_test ? `${pct(p.applied_on_test.mean_cap_pct, 2, true)} (${p.applied_on_test.rank})` : "—"]; }));

          tr.map(v => { const w = te.find(x => Math.abs(x.value - v.value) < 1e-9) || {}; return [num(v.value, 1), { v: pct(v.mean_cap_pct, 2, true), cls: cls(v.mean_cap_pct) }, pct(v.best_cap_pct, 2, true),

  const spans = wins.map(w => spanOf(F.windows[w])).filter(x => x != null);
  document.getElementById("wfRead").textContent = t("wf_read", { pairs_read: reads, applied_read: applied, off_span: spans.length ? `${num(Math.min(...spans) * 2, 2)}–${num(Math.max(...spans) * 2, 2)}` : "—" });
