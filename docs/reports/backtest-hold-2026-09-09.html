let lang = "vi", win = WINS[0];
try { lang = localStorage.getItem("hold.lang") || lang; const w = localStorage.getItem("hold.win"); if (w && DATA.windows[w]) win = w; } catch (e) {}

const t = (k, vars) => { let s = T[lang][k]; if (s === undefined) s = T.vi[k]; if (s === undefined) return k;
  return vars ? s.replace(/\{(\w+)\}/g, (_, v) => vars[v] ?? "") : s; };
const loc = () => lang === "zh" ? "zh-CN" : "vi-VN";
const num = (v, d = 0) => v == null || Number.isNaN(v) ? "—" : new Intl.NumberFormat(loc(), { minimumFractionDigits: d, maximumFractionDigits: d }).format(v);
const pct = (v, d = 2, sign = false) => v == null ? "—" : (sign && v > 0 ? "+" : "") + num(v, d) + "%";
const cls = v => v == null ? "" : v < 0 ? "loss" : v > 0 ? "gain" : "";
const day = ms => new Date(ms).toISOString().slice(0, 10);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const sname = (sym, perp) => sym.replace("USDT", "") + "·" + perp.replace("_futures", "");
const g = v => num(v, Number.isInteger(v) ? 0 : (Math.abs(v) < 0.1 ? 3 : 2));
const fmtSet = p => `${g(p.min_rate_per_8h_bps)}/${g(p.persistence_periods)} · ${num(p.exit_net_apr_frac * 100, 2)}%/${g(p.exit_persistence_periods)} · X${g(p.exit_negative_min_bps)} N${g(p.exit_negative_periods)} C${g(p.exit_negative_cum_cost_frac)} · M${g(p.min_hold_recovered_cost_frac)} · ${g(p.holding_days)}d`;
const listVI = xs => xs.length <= 1 ? xs.join("") : xs.slice(0, -1).join(", ") + (lang === "zh" ? "、" : " và ") + xs[xs.length - 1];

function svg(w, h) { return `<svg viewBox="0 0 ${w} ${h}" role="img">`; }

function horizonChart(rows, ht) {
  // One row per series: p25→p75 band and median (any entry); a dot for the
  // rule-entry median. Reference lines at the holding_days values the grid
  // swept, so the reader sees which of them covers which quantile.
  const W = 760, rowH = 22, L = 150, R = 30, Tp = 22, B = 30;
  const H = Tp + rows.length * rowH + B;
  const maxD = Math.max(120, ...rows.map(r => r.any_entry.p75 || 0), ...rows.map(r => r.rule_entry.median || 0)) * 1.05;
  const x = d => L + (W - L - R) * Math.min(d, maxD) / maxD;
  let s = svg(W, H);
  const refs = (DATA.grid.holding_days || []).filter(d => d <= maxD);
  for (const d of [0, 30, 60, 90, 120, 150, 180, 240, 300, 365].filter(d => d <= maxD)) {
    s += `<line class="grid" x1="${x(d)}" x2="${x(d)}" y1="${Tp - 4}" y2="${H - B}"/><text x="${x(d)}" y="${H - B + 14}" text-anchor="middle">${d}</text>`;
  }
  for (const d of refs) s += `<line class="marker" x1="${x(d)}" x2="${x(d)}" y1="${Tp - 8}" y2="${H - B}"/><text class="marker-text" x="${x(d) + 3}" y="${Tp - 10}">hold ${d}</text>`;
  rows.forEach((r, i) => {
    const y = Tp + i * rowH, a = r.any_entry, ru = r.rule_entry;
    const good = (ht[`${r.symbol}|${r.perp}`] || 0) > 0;
    const c = good ? "bar-gain" : "bar-loss";
    s += `<text x="${L - 8}" y="${y + rowH / 2 + 4}" text-anchor="end">${esc(sname(r.symbol, r.perp))} <tspan style="font-size:9px">${r.interval_sec / 3600}h</tspan></text>`;
    if (a.p25 != null && a.p75 != null) {
      s += `<rect class="${c}" opacity=".35" x="${x(a.p25)}" y="${y + 5}" width="${Math.max(1, x(a.p75) - x(a.p25))}" height="${rowH - 10}"><title>${esc(sname(r.symbol, r.perp))} P25 ${num(a.p25, 1)} → P75 ${num(a.p75, 1)}</title></rect>`;
    }
    if (a.median != null) s += `<line x1="${x(a.median)}" x2="${x(a.median)}" y1="${y + 3}" y2="${y + rowH - 3}" style="stroke:var(--${good ? "gain" : "loss"});stroke-width:2"><title>${t("hz_any")}: ${num(a.median, 1)}</title></line>`;
    else s += `<text x="${L + 4}" y="${y + rowH / 2 + 4}" class="loss" style="font-size:10px">∞</text>`;
    if (ru.median != null) s += `<circle cx="${x(ru.median)}" cy="${y + rowH / 2}" r="3.5" style="fill:var(--ink)"><title>${t("hz_rule")}: ${num(ru.median, 1)}</title></circle>`;
  });
  s += `<line class="axis" x1="${L}" x2="${W - R}" y1="${H - B}" y2="${H - B}"/>`;
  s += `<text x="${(L + W - R) / 2}" y="${H - 4}" text-anchor="middle">${esc(t("hz_days"))}</text>`;
  return s + "</svg>";
}

function heatBlock(h, xLabel, yLabel) {
  const vals = h.cells.flat().filter(Boolean).map(c => c.best);
  const lo = Math.min(...vals), hi = Math.max(...vals);
  const bg = v => { if (v == null) return ""; const a = v >= 0 ? Math.min(1, v / (hi || 1)) : Math.min(1, v / (lo || -1)); return `background:rgba(var(--${v >= 0 ? "gain" : "loss"}-rgb),${0.12 + 0.55 * a})`; };
  let s = `<div class="heatwrap"><div class="heat" style="grid-template-columns:max-content repeat(${h.x.length},1fr)">`;
  s += `<div class="rh">${esc(yLabel)} \\ ${esc(xLabel)}</div>` + h.x.map(v => `<div class="h">${g(v)}</div>`).join("");
  h.y.forEach((yv, i) => {
    s += `<div class="rh">${g(yv)}</div>`;

    const R = sr.reasons;
    document.getElementById("lgRead").textContent = t("lg_read_end", { end: R.window_end, end_be: endBe })
      + (R.sign_flip ? t("lg_read_flip", { flip: R.sign_flip, flip_series: listVI(flipSeries), flip_be: L.filter(x => x.reason === "sign_flip" && x.net_frac >= 0).length }) : t("lg_read_noflip"))
      + (R.decay ? t("lg_read_decay", { decay: R.decay }) : t("lg_read_nodecay"))
      + (R.basis ? t("lg_read_basis", { basis: R.basis, basis_series: listVI(basisSeries), basis_be: L.filter(x => x.reason === "basis" && x.net_frac >= 0).length }) : "")
      + (lossN ? t("lg_read_loss", { lossn: lossN, loss_end: lossEnd }) : t("lg_read_noloss"));
    document.getElementById("lgTable").innerHTML = `<thead><tr><th>${t("lg_col_series")}</th><th>${t("lg_col_open")}</th><th>${t("lg_col_close")}</th><th class="num">${t("lg_col_days")}</th><th class="num">${t("lg_col_settle")}</th><th class="num">${t("lg_col_fund")}</th><th class="num">${t("lg_col_cost")}</th><th class="num">${t("lg_col_netc")}</th><th>${t("lg_col_why")}</th></tr></thead><tbody>` +
      L.map(x => `<tr><td>${esc(sname(x.symbol, x.perp))}</td><td class="mono">${day(x.open_ms)}</td><td class="mono">${day(x.close_ms)}</td><td class="num">${num(x.held_days, 1)}</td><td class="num">${num(x.settlements)}</td><td class="num ${cls(x.funding_frac)}">${pct(capPct(x.funding_frac), 3, true)}</td><td class="num">${pct(capPct(x.cost_frac), 3)}</td><td class="num ${cls(x.net_frac)}"><b>${pct(capPct(x.net_frac), 3, true)}</b></td><td><span class="pill ${x.reason === "window_end" ? "open" : x.reason === "basis" ? "partial" : "fail"}">${t("r_" + x.reason)}</span></td></tr>`).join("") + "</tbody>";
  } else {
    document.getElementById("ledger").hidden = true;
  }

  // --- marginals ---
  document.getElementById("mgCaption").textContent = t("mg_caption", { series: S });
  const M = W.marginals, order = ["holding_days", "exit_persistence_periods", "min_hold_recovered_cost_frac", "exit_net_apr_frac", "exit_negative_min_bps", "exit_negative_periods", "exit_negative_cum_cost_frac", "min_rate_per_8h_bps", "persistence_periods"].filter(a => M[a]);
  const spreadOf = a => { const m = M[a].map(v => v.median_cap_pct); return Math.max(...m) - Math.min(...m); };
  const ranked = order.slice().sort((a, b) => spreadOf(b) - spreadOf(a));
  const top = ranked[0], tv = M[top];
  const lo = tv.reduce((a, b) => a.median_cap_pct < b.median_cap_pct ? a : b), hi = tv.reduce((a, b) => a.median_cap_pct > b.median_cap_pct ? a : b);
  const flat = ranked.filter(a => spreadOf(a) < 0.02).map(a => SHORT[a]);
  document.getElementById("mgRead").textContent = t("mg_read", { top_axis: top, a_lo: g(lo.value), a_hi: g(hi.value), v_lo: pct(lo.median_cap_pct, 3, true), v_hi: pct(hi.median_cap_pct, 3, true), flat_sentence: flat.length ? t("mg_flat", { flat_axes: flat.join(", ") }) : "" });
  document.getElementById("mgGrid").innerHTML = order.map(a => `<div class="small"><h3>${esc(t("ax_" + a))}</h3><div class="tablewrap"><table><thead><tr><th class="num">${t("mg_col_val")}</th><th class="num">${t("mg_col_mean")}</th><th class="num">${t("mg_col_med")}</th><th class="num">${t("mg_col_best")}</th><th class="num">${t("mg_col_be")}</th><th class="num">${t("mg_col_flip")}</th><th class="num">${t("mg_col_decay")}</th><th class="num">${t("mg_col_basis")}</th><th class="num">${t("mg_col_tr")}</th><th class="num">${t("mg_col_held")}</th></tr></thead><tbody>` +
    M[a].map(v => `<tr><td class="num"><b>${g(v.value)}</b></td><td class="num ${cls(v.mean_cap_pct)}">${pct(v.mean_cap_pct, 3, true)}</td><td class="num ${cls(v.median_cap_pct)}">${pct(v.median_cap_pct, 3, true)}</td><td class="num ${cls(v.best_cap_pct)}">${pct(v.best_cap_pct, 3, true)}</td><td class="num">${pct((v.be_share || 0) * 100, 0)}</td><td class="num">${pct((v.flip_share || 0) * 100, 0)}</td><td class="num">${pct((v.decay_share || 0) * 100, 0)}</td><td class="num">${pct((v.basis_share || 0) * 100, 0)}</td><td class="num">${num(v.trades_per_series, 2)}</td><td class="num">${num(v.mean_held_days, 0)}</td></tr>`).join("") + "</tbody></table></div></div>").join("");

  // --- heat ---
  const heats = [[W.heat_hold_N, t("ht_x"), t("ht_y_N")], [W.heat_hold_M, t("ht_x"), t("ht_y_M")], [W.heat_M_C, t("ht_x_M"), t("ht_y_C")]].filter(([h]) => h && h.x.length > 1 && h.y.length > 1);
  document.getElementById("heatGrid").innerHTML = heats.map(([h, xl, yl]) => `<div class="small"><h3>${esc(yl)} × ${esc(xl)}</h3>${heatBlock(h, xl, yl)}</div>`).join("");
  document.getElementById("heat").hidden = heats.length === 0;

  // --- top ---
  document.getElementById("topCaption").textContent = t("top_caption", { series: S, days: num(W.window_days, 0), ht: pct(HT.mean_cap_pct, 2, true), n_ht: num(HT.sets_at_or_above), sets: num(W.sets) });
  document.getElementById("topTable").innerHTML = setTable(W.top.slice(0, 15));
  document.getElementById("cleanCaption").textContent = t("clean_caption", { n: num(W.clean_count) });
  document.getElementById("cleanTable").innerHTML = setTable(W.clean_best.slice(0, 8));
  document.getElementById("beTable").innerHTML = setTable(W.be_best.slice(0, 8));

  // --- method ---
  const gridTxt = AXES.filter(a => (DATA.grid[a] || []).length > 1).map(a => `${SHORT[a]} ∈ {${DATA.grid[a].map(g).join(", ")}}`).join("; ");
  const items = [t("me_1", { sets: num(W.sets), series: S, days: num(W.window_days, 0), to: day(W.window_to_ms), grid: gridTxt, commit: META.commit }),
    t("me_2", { cap: num(cap, 1), series: S }), t("me_3"), t("me_4"), t("me_5"), t("me_6"), t("me_7")];
  document.getElementById("methodList").innerHTML = items.map(x => `<li>${esc(x)}</li>`).join("");
  document.getElementById("genNote").textContent = t("gen_note", { when: META.generated });
}

document.querySelectorAll("#langSeg button").forEach(b => b.onclick = () => { lang = b.dataset.lang; try { localStorage.setItem("hold.lang", lang); } catch (e) {} render(); });
render();
</script>
