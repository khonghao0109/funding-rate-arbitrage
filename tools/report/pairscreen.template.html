<title>Sàng cặp</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
:root{
  --ground:#F4F6F3; --surface:#FFFFFF; --ink:#1A2024; --muted:#5F6B72; --rule:#D6DCD8; --rule-soft:#E6EAE7;
  --accent:#35507A; --accent-ink:#FFFFFF; --loss:#B4552D; --gain:#1E7A6C; --warn:#B8891E;
  --loss-rgb:180,85,45; --gain-rgb:30,122,108; --accent-rgb:53,80,122;
  --display:"Bricolage Grotesque","IBM Plex Sans","Noto Sans SC","Helvetica Neue",Arial,sans-serif;
  --body:"IBM Plex Sans","Noto Sans SC","Helvetica Neue",Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#131719; --surface:#1B2124; --ink:#E8ECE7; --muted:#98A3A9; --rule:#2C353A; --rule-soft:#232B2F;
    --accent:#93B4E6; --accent-ink:#0F141A; --loss:#E5865E; --gain:#52B8A5; --warn:#D9B052;
    --loss-rgb:229,134,94; --gain-rgb:82,184,165; --accent-rgb:147,180,230; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ground:#131719; --surface:#1B2124; --ink:#E8ECE7; --muted:#98A3A9; --rule:#2C353A; --rule-soft:#232B2F;
  --accent:#93B4E6; --accent-ink:#0F141A; --loss:#E5865E; --gain:#52B8A5; --warn:#D9B052;
  --loss-rgb:229,134,94; --gain-rgb:82,184,165; --accent-rgb:147,180,230; color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
:lang(zh) body, body:lang(zh){font-family:"Noto Sans SC","IBM Plex Sans",sans-serif}
a{color:var(--accent)}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.15}
h1{font-size:2rem;font-weight:700;letter-spacing:-.01em}
h2{font-size:1.35rem;font-weight:700}
h3{font-size:1.05rem;font-weight:600}
.eyebrow{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.mono,.num,td.num,th.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.loss{color:var(--loss)} .gain{color:var(--gain)} .warn{color:var(--warn)}
.topbar{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--ground) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--rule)}
.topbar .in{max-width:1040px;margin:0 auto;padding:.6rem 1.25rem;display:flex;align-items:center;gap:1rem;flex-wrap:wrap}
.topbar .name{font-family:var(--display);font-weight:700;font-size:1rem;margin-right:auto}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:999px;padding:2px;gap:2px;background:var(--surface)}
.seg button{border:0;background:transparent;color:var(--muted);font:inherit;font-weight:500;padding:.25rem .7rem;border-radius:999px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{max-width:1040px;margin:0 auto;padding:2rem 1.25rem 4rem;display:grid;gap:3rem}
section{display:grid;gap:1rem}
section>header{display:grid;gap:.35rem;max-width:70ch}
p{margin:0;max-width:70ch}
.verdict{background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:1.5rem;display:grid;gap:1.25rem}
.verdict h1{font-size:clamp(1.5rem,3.2vw,2.3rem)}
.figures{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1rem;border-top:1px solid var(--rule-soft);padding-top:1rem}
.fig{display:grid;gap:.15rem}
.fig .v{font-family:var(--mono);font-size:1.6rem;font-weight:500;line-height:1.1;font-variant-numeric:tabular-nums}
.fig .l{font-size:.8rem;color:var(--muted)}
.note{font-size:.85rem;color:var(--muted);max-width:none}
.legend{display:flex;gap:1.2rem;flex-wrap:wrap;font-size:.8rem;color:var(--muted)}
.legend i{display:inline-block;width:.8em;height:.8em;border-radius:2px;vertical-align:-1px;margin-right:.35em}
.i-loss{background:var(--loss)} .i-gain{background:var(--gain)} .i-accent{background:var(--accent)} .i-warn{background:var(--warn)}
.tablewrap{overflow-x:auto;border:1px solid var(--rule);border-radius:10px;background:var(--surface)}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:.86rem}
th,td{text-align:left;padding:.5rem .7rem;border-bottom:1px solid var(--rule-soft);vertical-align:top;white-space:nowrap}
/* The header stays put while a long table scrolls: 24 series × several
   columns is past the point where a reader can hold the column names. */
th{position:sticky;top:0;z-index:2;background:var(--surface);font-weight:600;color:var(--muted);
   font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;border-bottom:1px solid var(--rule)}
td.num,th.num{text-align:right}
tbody tr:nth-child(even) td{background:color-mix(in srgb,var(--ink) 3%,transparent)}
tbody tr:hover td{background:color-mix(in srgb,var(--accent) 8%,transparent)}
tbody tr:last-child td{border-bottom:0}
td.wrap{white-space:normal;min-width:22ch;max-width:52ch}
/* First column pinned on the wide tables, so a row never loses its name. */
table.pin td:first-child,table.pin th:first-child{position:sticky;left:0;z-index:1;background:var(--surface)}
table.pin tbody tr:nth-child(even) td:first-child{background:color-mix(in srgb,var(--ink) 3%,var(--surface))}
table.pin th:first-child{z-index:3}
/* A cell holding a whole parameter set: one column instead of ten. */
td.params{font-family:var(--mono);font-size:.78rem;color:var(--muted)}
td.params b{color:var(--ink);font-weight:600}
.scrollhint{font-size:.78rem;color:var(--muted);margin-top:.35rem}
.chart{width:100%;overflow-x:auto}
.chart svg{display:block;width:100%;height:auto;font-family:var(--mono);font-size:11px}
.chart .axis{stroke:var(--rule);stroke-width:1}
.chart .grid{stroke:var(--rule-soft);stroke-width:1}
.chart text{fill:var(--muted)}
.chart .bar-loss{fill:var(--loss)} .chart .bar-gain{fill:var(--gain)} .chart .bar-accent{fill:var(--accent)} .chart .bar-warn{fill:var(--warn)}
.chart .marker{stroke:var(--ink);stroke-width:1;stroke-dasharray:3 3}
.chart .marker-text{fill:var(--ink);font-weight:500}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:1.5rem 2rem}
.small h3{margin-bottom:.35rem}
.heat{display:grid;gap:2px;font-family:var(--mono);font-size:.78rem;font-variant-numeric:tabular-nums}
.heat .c{padding:.35rem .4rem;text-align:right;border-radius:3px;min-width:4.5em;line-height:1.2}
.heat .c small{display:block;font-size:.66rem;opacity:.75}
.heat .h{color:var(--muted);text-align:right;padding:.35rem .4rem;font-size:.7rem}
.heat .rh{color:var(--muted);text-align:left;padding:.35rem .4rem;font-size:.7rem}
.heatwrap{overflow-x:auto}
.heat-title{display:flex;justify-content:space-between;gap:1rem;align-items:baseline;flex-wrap:wrap}
.bullets{margin:0;padding-left:1.2rem;display:grid;gap:.5rem;max-width:75ch}
.bullets li::marker{color:var(--accent)}
.assume{background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:1.25rem 1.5rem}
.assume ol{margin:0;padding-left:1.2rem;display:grid;gap:.6rem;max-width:80ch}
pre{margin:0;background:var(--surface);border:1px solid var(--rule);border-radius:8px;padding:1rem;overflow-x:auto;font-family:var(--mono);font-size:.8rem;line-height:1.5}
.pill{display:inline-block;padding:.05rem .5rem;border-radius:999px;font-size:.72rem;font-weight:600;letter-spacing:.03em;border:1px solid currentColor}
.pill.fail,.pill.weak{color:var(--loss)} .pill.pass{color:var(--gain)} .pill.partial{color:var(--warn)} .pill.open{color:var(--muted)}
.tabs{display:flex;gap:.5rem;flex-wrap:wrap}
.tabs button{font:inherit;font-size:.85rem;border:1px solid var(--rule);background:var(--surface);color:var(--ink);padding:.3rem .75rem;border-radius:6px;cursor:pointer}
.tabs button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);font-weight:600}
.tabs button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:.35rem 1.25rem;font-size:.9rem;align-items:baseline}
.pagenav{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:-2rem}
.pagenav a{font-size:.8rem;text-decoration:none;color:var(--muted);border:1px solid var(--rule);background:var(--surface);border-radius:999px;padding:.2rem .7rem}
.pagenav a:hover,.pagenav a:focus-visible{color:var(--accent);border-color:var(--accent)}
.answer{border:1px solid var(--rule);border-radius:12px;overflow:hidden;background:var(--surface)}
.answer .row{display:grid;grid-template-columns:1fr 7.5rem 6rem 6rem;gap:.35rem 1rem;padding:.8rem 1.25rem;border-bottom:1px solid var(--rule-soft);align-items:baseline}
.answer .row:last-child{border-bottom:0}
.answer .row.head{background:color-mix(in srgb,var(--accent) 8%,transparent);font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
.answer .row.head span:not(:first-child){text-align:right}
.answer .who{font-weight:600;font-size:.95rem}
.answer .who small{display:block;font-weight:400;font-size:.8rem;color:var(--muted);line-height:1.4;margin-top:.1rem}
.answer .v{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:1.05rem;text-align:right}
.answer .v.sub{font-size:.9rem;color:var(--muted)}
.answer .v small{display:block;font-size:.72rem;font-weight:400;color:var(--muted);margin-top:.15rem;letter-spacing:.01em}
.answer .row{grid-template-columns:1fr 9.5rem 6rem 6rem}
.gloss{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:1.1rem 2rem;margin:0}
.gloss>div{display:grid;gap:.15rem;align-content:start}
.gloss dt{font-weight:600;font-size:.9rem;margin:0}
.gloss dd{margin:0;font-size:.85rem;color:var(--muted);max-width:48ch}
@media (max-width:620px){.answer .row{grid-template-columns:1fr max-content}.answer .row .v.sub{display:none}.answer .row.head span:nth-child(3),.answer .row.head span:nth-child(4){display:none}}
.kv dt{color:var(--muted);margin:0} .kv dd{margin:0}
footer{font-size:.8rem;color:var(--muted);border-top:1px solid var(--rule);padding-top:1rem}
@media (prefers-reduced-motion:no-preference){.seg button,.tabs button{transition:background .15s,color .15s}}
/* The one-axis and marginal tables carry 8–10 columns: two per row at most,
   and the marginals one per row, or the columns past the fourth are only
   reachable by scrolling inside each card. */
#oaGrid{grid-template-columns:repeat(auto-fit,minmax(480px,1fr))}
#mgGrid{grid-template-columns:1fr}
#oaDiffTable td.wrap{min-width:16ch}
#sumChart .bar-pass{fill:var(--gain)} #sumChart .bar-fail{fill:var(--loss)} #sumChart .bar-bridged{fill:var(--warn)} #sumChart .bar-worth{fill:var(--accent)}
td.checks{white-space:normal;min-width:30ch;max-width:60ch;font-size:.78rem;line-height:1.5}
td.checks .pill{margin-right:.3rem}
</style>

<div class="topbar"><div class="in">
  <span class="name" data-i18n="title"></span>
  <span class="muted" style="font-size:.8rem" id="windowLabel"></span>
  <div class="seg" id="langSeg" role="group" aria-label="language">
    <button type="button" data-lang="vi" aria-pressed="true">Tiếng Việt</button>
    <button type="button" data-lang="zh" aria-pressed="false">中文</button>
  </div>
</div></div>

<main>
  <section class="verdict" id="verdict">
    <div class="eyebrow" data-i18n="verdict_eyebrow"></div>
    <h1 id="verdictHeadline"></h1>
    <p id="verdictSub" class="note"></p>
    <div class="figures" id="figures"></div>
    <p class="note" id="capNote"></p>
  </section>

  <nav class="pagenav" id="pageNav"></nav>

  <section id="symbols">
    <header><div class="eyebrow" data-i18n="sy_eyebrow"></div><h2 data-i18n="sy_title"></h2><p class="note" id="syCaption"></p></header>
    <div class="chart" id="sumChart"></div>
    <div class="legend"><span><i class="i-gain"></i><span data-i18n="sy_leg_pass"></span></span><span><i class="i-accent"></i><span id="syLegWorth"></span></span><span><i class="i-warn"></i><span data-i18n="sy_leg_bridged"></span></span><span><i class="i-loss"></i><span data-i18n="sy_leg_fail"></span></span><span class="muted" data-i18n="sy_leg_lines"></span></div>
    <div class="tablewrap"><table class="pin" id="syTable"></table></div>
    <p id="syRead"></p>
  </section>

  <section id="rows">
    <header><div class="eyebrow" data-i18n="rw_eyebrow"></div><h2 data-i18n="rw_title"></h2><p class="note" data-i18n="rw_caption"></p></header>
    <div class="tabs" id="rwTabs"></div>
    <div class="tablewrap"><table class="pin" id="rwTable"></table></div>
    <p class="scrollhint" data-i18n="rw_hint"></p>
  </section>

  <section id="risks">
    <header><div class="eyebrow" data-i18n="rk_eyebrow"></div><h2 data-i18n="rk_title"></h2><p class="note" data-i18n="rk_caption"></p></header>
    <ul class="bullets" id="rkList"></ul>
  </section>

  <section id="method">
    <header><div class="eyebrow" data-i18n="me_eyebrow"></div><h2 data-i18n="me_title"></h2></header>
    <div class="assume"><ol id="methodList"></ol></div>
    <p class="note" id="genNote"></p>
  </section>
</main>

  return vars ? s.replace(/\{(\w+)\}/g, (_, v) => vars[v] ?? "") : s; };
const loc = () => lang === "zh" ? "zh-CN" : "vi-VN";
const num = (v, d = 0) => v == null || Number.isNaN(v) ? "—" : new Intl.NumberFormat(loc(), { minimumFractionDigits: d, maximumFractionDigits: d }).format(v);
const pct = (v, d = 2, sign = false) => v == null ? "—" : (sign && v > 0 ? "+" : "") + num(v, d) + "%";
const cls = v => v == null ? "" : v < 0 ? "loss" : v > 0 ? "gain" : "";

const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function svg(w, h) { return `<svg viewBox="0 0 ${w} ${h}" role="img">`; }

function sumChart(syms) {
  const rows = syms.filter(s => s.best);
  const W = 760, rowH = 20, L = 90, R = 150, Tp = 20, B = 30, H = Tp + rows.length * rowH + B;
  const vals = rows.map(s => s.best.mean_bps);
  const lo = Math.min(0, ...vals), hi = Math.max(C.min_bps * 1.1, ...vals);
  const x = v => L + (W - L - R) * (v - lo) / ((hi - lo) || 1);
  let s = svg(W, H);
  const zero = x(0);
  for (const [v, label] of [[C.min_bps, "K=2"], [bpsK12, "K≈1,2"]]) s += `<line class="marker" x1="${x(v)}" x2="${x(v)}" y1="${Tp - 8}" y2="${H - B}"/><text class="marker-text" x="${x(v) + 3}" y="${Tp - 10}">${label} ${num(v, 2)}</text>`;
  s += `<line class="axis" x1="${zero}" x2="${zero}" y1="${Tp}" y2="${H - B}"/>`;
  rows.forEach((sy, i) => {
    const y = Tp + i * rowH, v = sy.best.mean_bps;
    const c = sy.best.passed ? "bar-pass" : sy.best.worth ? (sy.best.bridged ? "bar-bridged" : "bar-worth") : "bar-fail";
    s += `<text x="${L - 8}" y="${y + rowH / 2 + 4}" text-anchor="end" style="${SHIPPED.includes(sy.symbol) ? "font-weight:600;fill:var(--ink)" : ""}">${esc(sy.symbol.replace("USDT", ""))}</text>`;
    s += `<rect class="${c}" x="${Math.min(zero, x(v))}" y="${y + 4}" width="${Math.max(1, Math.abs(x(v) - zero))}" height="${rowH - 8}"><title>${esc(sy.symbol)} · ${esc(short(sy.best.perp))}: ${num(v, 3)} bps/8h</title></rect>`;
    s += `<text x="${Math.max(zero, x(v)) + 5}" y="${y + rowH / 2 + 4}">${num(v, 2)} · ${esc(short(sy.best.perp))}${sy.best.bridged ? " (USD)" : ""}</text>`;
  });
  s += `<text x="${(L + W - R) / 2}" y="${H - 6}" text-anchor="middle">${esc(t("sy_x"))}</text>`;
  return s + "</svg>";
}

function pill(c) { return `<span class="pill ${c.passed ? "pass" : "fail"}" title="${esc(c.detail)}">${t("c_" + c.name)}</span>`; }

  const bestSym = S.find(s => s.best);
  document.getElementById("figures").innerHTML = fig(R.length, t("fig_rows")) + fig(cnt("listed"), t("fig_listed")) + fig(cnt("book_fits"), t("fig_fit", { notional: kUSD(N) })) +
    fig(cnt("funding_pays"), t("fig_pays", { min_bps: num(C.min_bps, 2) }), cnt("funding_pays") ? "gain" : "loss") + fig(passed.length, t("fig_pass"), passed.length ? "gain" : "loss") + fig(R.filter(r => r.worth_backtest).length, t("fig_worth", { bt_bps: num(C.backtest_bps, 2) }), R.some(r => r.worth_backtest) ? "gain" : "") +
    (bestSym ? fig(num(bestSym.best.mean_bps, 2), t("fig_best") + " · " + bestSym.symbol.replace("USDT", "")) : "");
  document.getElementById("capNote").textContent = t("cap_note", { min_bps: num(C.min_bps, 2), cap: num(cap, 1), gross: num(gross, 1), min_bps_k12: num(bpsK12, 2) });

  // symbols
  document.getElementById("syCaption").textContent = t("sy_caption", { min_bps: num(C.min_bps, 2), min_bps_k12: num(bpsK12, 2) });
  document.getElementById("sumChart").innerHTML = sumChart(S);
  document.getElementById("syLegWorth").textContent = t("sy_leg_worth", { bt_bps: num(C.backtest_bps, 2) });
  document.getElementById("syTable").innerHTML = `<thead><tr><th>${t("sy_col_sym")}</th><th class="num">${t("sy_col_listed")}</th><th class="num">${t("sy_col_paired")}</th><th class="num">${t("sy_col_pass")}</th><th class="num">${t("sy_col_worth")}</th><th>${t("sy_col_best")}</th><th class="num">${t("sy_col_bps")}</th><th class="num">${t("sy_col_ht")}</th><th>${t("sy_col_bridge")}</th><th>${t("sy_col_unb")}</th></tr></thead><tbody>` +
    S.map(s => { const b = s.best, u = s.best_unbridged; return `<tr><td${SHIPPED.includes(s.symbol) ? ' style="font-weight:600"' : ""}>${esc(s.symbol)}</td><td class="num">${s.venues_listed}</td><td class="num">${s.venues_paired}</td><td class="num ${s.venues_passed ? "gain" : ""}">${s.venues_passed}</td><td class="num ${s.venues_worth ? "gain" : ""}">${s.venues_worth}${s.venues_worth ? ` <small class="muted">(${s.worth_unbridged} USDT)</small>` : ""}</td><td>${b ? esc(short(b.perp)) : "—"}</td><td class="num ${b ? cls(b.mean_bps) : ""}">${b ? num(b.mean_bps, 3) : "—"}</td><td class="num ${b ? cls(b.ht_net_cap_pct) : ""}">${b ? pct(b.ht_net_cap_pct, 2, true) : "—"}</td><td>${b && b.bridged ? '<span class="pill partial">USD/USDT</span>' : ""}</td><td>${u ? `${esc(short(u.perp))} ${num(u.mean_bps, 3)}` : "—"}</td></tr>`; }).join("") + "</tbody>";
  const above = S.filter(s => s.best && s.best.mean_bps >= C.min_bps), k12 = S.filter(s => s.best && s.best.mean_bps < C.min_bps && s.best.mean_bps >= bpsK12);
  const rank = s => S.indexOf(s) + 1;
  document.getElementById("syRead").textContent = t("sy_read", { n_above: above.length, min_bps: num(C.min_bps, 2), list_above: above.map(s => s.symbol.replace("USDT", "")).join(", ") || "—",
    n_k12: k12.length, list_k12: k12.map(s => s.symbol.replace("USDT", "")).join(", ") || "—",
    shipped: S.filter(s => SHIPPED.includes(s.symbol)).map(s => `${s.symbol.replace("USDT", "")} #${rank(s)}`).join(", "),
    n_bridged: S.filter(s => s.best && s.best.bridged).length });

  // rows
  const tabs = [["all", r => true], ["pass", r => r.passed], ["worth", r => r.worth_backtest], ["paired", r => !!r.spot], ["unlisted", r => !r.listed]];
  document.getElementById("rwTabs").innerHTML = tabs.map(([k, f]) => `<button type="button" data-tab="${k}" aria-pressed="${String(k === tab)}">${t("tab_" + k)} (${R.filter(f).length})</button>`).join("");
  document.querySelectorAll("#rwTabs button").forEach(b => b.onclick = () => { tab = b.dataset.tab; render(); });
  const shown = R.filter(tabs.find(([k]) => k === tab)[1]);
  const cv = (r, k) => (r.corpus && r.corpus.model === "discrete") ? r.corpus[k] : null;
  document.getElementById("rwTable").innerHTML = `<thead><tr><th>${t("rw_col_sym")}</th><th>${t("rw_col_perp")}</th><th>${t("rw_col_spot")}</th><th class="num">${t("rw_col_cost")}</th><th class="num">${t("rw_col_thin")}</th><th class="num">${t("rw_col_cov")}</th><th>${t("rw_col_iv")}</th><th class="num">${t("rw_col_bps")}</th><th class="num">${t("rw_col_pos")}</th><th class="num">${t("rw_col_flips")}</th><th class="num">${t("rw_col_worst")}</th><th class="num">${t("rw_col_ht")}</th><th class="num">${t("rw_col_be")}</th><th class="num">${t("rw_col_w90")}</th><th>${t("rw_col_checks")}</th></tr></thead><tbody>` +
    shown.map(r => { const c = r.corpus && r.corpus.model === "discrete" ? r.corpus : null, hz = c && c.horizon; const ht = c && c.hold_through_net_pct != null ? c.hold_through_net_pct / cap : null;
      return `<tr><td>${esc(r.symbol)}</td><td>${esc(short(r.perp))}</td><td>${r.spot ? esc(short(r.spot)) + (r.bridged ? ' <span class="pill partial">USD</span>' : "") : "—"}</td><td class="num">${r.cost && r.cost.OK ? pct(r.cost.TotalPct, 3) : "—"}</td><td class="num ${r.listed && r.spot ? (r.min_depth_wide_quote >= N ? "gain" : "loss") : ""}">${r.spot ? kUSD(r.min_depth_wide_quote) : "—"}</td><td class="num">${c ? num(c.covered_days, 0) : (r.corpus ? esc(r.corpus.model) : "—")}</td><td>${c ? c.interval_sec / 3600 + "h" : "—"}</td><td class="num ${c ? cls(c.mean_rate_per_8h_bps) : ""}">${c ? num(c.mean_rate_per_8h_bps, 3) : "—"}</td><td class="num">${c ? pct(c.positive_share * 100, 0) : "—"}</td><td class="num">${c ? num(c.sign_flips_per_year, 0) : "—"}</td><td class="num">${c ? pct(c.worst_negative_episode_pct, 2) : "—"}</td><td class="num ${cls(ht)}">${ht == null ? "—" : pct(ht, 2, true)}</td><td class="num">${hz ? (hz.median == null ? "∞" : num(hz.median, 0)) : "—"}</td><td class="num">${hz ? pct(hz.within["90"] * 100, 0) : "—"}</td><td class="checks">${r.checks.map(pill).join("")}${!r.listed ? `<div class="muted">${esc(r.refusal_vi)}</div>` : ""}</td></tr>`; }).join("") + "</tbody>";

  // risks
  const unlisted = R.filter(r => !r.listed), byPerpUn = {};
  unlisted.forEach(r => { byPerpUn[r.perp] = (byPerpUn[r.perp] || 0) + 1; });
  const others = Object.entries(byPerpUn).filter(([p]) => p !== "paradex_futures").sort((a, b) => b[1] - a[1]).map(([p, n]) => `${short(p)} ${n}`).join(", ");
  const bridgedPass = R.filter(r => (r.passed || r.worth_backtest) && r.bridged);
  const thin = R.filter(r => r.spot && r.min_depth_wide_quote < N), thinnest = thin.length ? thin.reduce((a, b) => a.min_depth_wide_quote < b.min_depth_wide_quote ? a : b) : null;
  const costs = R.filter(r => r.cost && r.cost.OK).map(r => r.cost.TotalPct).sort((a, b) => a - b);
  const med = xs => xs.length ? xs[Math.floor(xs.length / 2)] : null;
  const flips = R.map(r => cv(r, "sign_flips_per_year")).filter(v => v != null).sort((a, b) => a - b);
  const worstEp = R.filter(r => cv(r, "worst_negative_episode_pct") != null).sort((a, b) => cv(b, "worst_negative_episode_pct") - cv(a, "worst_negative_episode_pct"))[0];
  const shortCov = R.filter(r => cv(r, "covered_days") != null && cv(r, "covered_days") < C.min_cover_days);
  const contracts = R.filter(r => r.listed && r.is_contract), minNot = R.filter(r => r.listed && r.min_notional_quote > 0);
  const levs = R.filter(r => r.listed && r.max_leverage_x > 0).map(r => r.max_leverage_x);
  const items = [
    t("rk_unlisted", { n: unlisted.length, paradex: byPerpUn["paradex_futures"] || 0, others: others || "—" }),
    t("rk_bridged", { n: bridgedPass.length }),
    t("rk_thin", { n: thin.length, notional: kUSD(N), worst: thinnest ? `${thinnest.symbol}·${short(thinnest.perp)} ${kUSD(thinnest.min_depth_wide_quote)}` : "—" }),
    t("rk_cost", { notional: kUSD(N), cost_lo: num(costs[0], 3), cost_hi: num(costs[costs.length - 1], 3), cost_med: num(med(costs), 3) }),
    t("rk_flips", { flips_lo: num(flips[0], 0), flips_hi: num(flips[flips.length - 1], 0), flips_med: num(med(flips), 0), worst_ep: worstEp ? num(cv(worstEp, "worst_negative_episode_pct"), 2) : "—", worst_ep_where: worstEp ? `${worstEp.symbol}·${short(worstEp.perp)}` : "—" }),
    t("rk_cover", { n: shortCov.length, min_cover: num(C.min_cover_days) }),
    t("rk_contract", { n: contracts.length, n_minnot: minNot.length }),
    t("rk_margin", { lev_lo: levs.length ? num(Math.min(...levs)) : "—", lev_hi: levs.length ? num(Math.max(...levs)) : "—" }),
    t("rk_regime"),
  ];
  document.getElementById("rkList").innerHTML = items.map(x => `<li>${esc(x)}</li>`).join("");
  document.getElementById("methodList").innerHTML = [t("me_1", { generated: new Date(DATA.generated_at_ms).toISOString().slice(0, 16).replace("T", " ") + " UTC", notional: kUSD(N) }), t("me_2", { cap: num(cap, 1) }), t("me_3", { cap: num(cap, 1), gross: num(gross, 1), min_bps: num(C.min_bps, 2) }), t("me_4"), t("me_5")].map(x => `<li>${esc(x)}</li>`).join("");
  document.getElementById("genNote").textContent = t("gen_note", { when: META.generated });
}
document.querySelectorAll("#langSeg button").forEach(b => b.onclick = () => { lang = b.dataset.lang; try { localStorage.setItem("ps.lang", lang); } catch (e) {} render(); });
render();
</script>
