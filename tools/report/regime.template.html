function tbl(head, rows) {
  const th = head.map(h => `<th${h.num ? ' class="num"' : ""}>${esc(h.label)}</th>`).join("");
  const body = rows.map(r => "<tr>" + r.map((c, i) => {

    return `<td${k}>${typeof v === "string" && v.startsWith("<") ? v : esc(v)}</td>`; }).join("") + "</tr>").join("");
  return `<thead><tr>${th}</tr></thead><tbody>${body}</tbody>`;
}

      exbnb: O && O.free.excluding_bnb ? pct(O.free.excluding_bnb.mean_edge_cap_pct, 2, true) : "—", btceth: O && O.free.btc_eth_only ? pct(O.free.btc_eth_only.mean_edge_cap_pct, 2, true) : "—" }),
  ];
  if (R.allocation && R.oracle) {
    const a = R.allocation.schemes.all, h = R.allocation.schemes.no_hyperliquid;

      lazy: pct(R.oracle.lazy7.mean_edge_cap_pct, 2, true) }));
  }

      `${setLabel(p.test_best)} ${pct(p.test_best.mean_cap_pct, 2, true)}`, p.applied_on_test ? `${pct(p.applied_on_test.mean_cap_pct, 2, true)} (${p.applied_on_test.rank})` : "—"]; }));

          tr.map(v => { const w = te.find(x => Math.abs(x.value - v.value) < 1e-9) || {}; return [num(v.value, 1), { v: pct(v.mean_cap_pct, 2, true), cls: cls(v.mean_cap_pct) }, pct(v.best_cap_pct, 2, true),

function renderMethod() {

  document.getElementById("meGloss").innerHTML = [["gl_sp", "gl_sp_d"], ["gl_bps", "gl_bps_d"], ["gl_ht", "gl_ht_d"], ["gl_wf", "gl_wf_d"]].map(([k, d]) => `<div><dt>${esc(t(k))}</dt><dd>${esc(t(d))}</dd></div>`).join("");
  document.getElementById("footText").textContent = t("foot", META);
}

function render() {
  document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll("#langSeg button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
  document.title = t("title");
  renderVerdict(); renderRules(); renderPred(); renderPers(); renderRegime(); renderOracle(); renderAlloc(); renderWF(); renderMethod();
}
document.querySelectorAll("#langSeg button").forEach(b => b.onclick = () => { lang = b.dataset.lang; render(); });
render();
</script>
