.heat .h{color:var(--muted);text-align:right;padding:.35rem .4rem;font-size:.7rem}
.heat .rh{color:var(--muted);text-align:left;padding:.35rem .4rem;font-size:.7rem}
.heatwrap{overflow-x:auto}
.heat-title{display:flex;justify-content:space-between;gap:1rem;align-items:baseline;flex-wrap:wrap}

pre{margin:0;background:var(--surface);border:1px solid var(--rule);border-radius:8px;padding:1rem;overflow-x:auto;font-family:var(--mono);font-size:.8rem;line-height:1.5}

.tabs{display:flex;gap:.5rem;flex-wrap:wrap}

.answer .row{grid-template-columns:1fr 9.5rem 6rem 6rem}

const table = (id, head, rows) => {
  const el = document.getElementById(id);
  el.innerHTML = "<thead><tr>" + head.map(h => `<th class="${h.num ? "num" : ""}">${esc(h.l)}</th>`).join("") + "</tr></thead><tbody>" +
    rows.map(r => "<tr>" + r.map(c => `<td class="${c.cls || ""}">${c.html !== undefined ? c.html : esc(c.v)}</td>`).join("") + "</tr>").join("") + "</tbody>";
};
const N = (v, d, extra) => ({ v: v === null || v === undefined ? "—" : num(v, d), cls: "num " + (extra || "") });
const P = (v, d) => ({ v: pct(v, d), cls: "num " + cls(v) });

function renderVerdict() {
  const w = W(), off = offOf(w), lit = litOf(w), best = bestOf(w, "cost"), nCost = w.sets.filter(s => s.kind === "cost").length;
  const gap = best.mean_cap_pct - off.mean_cap_pct;
  document.getElementById("vHeadline").textContent = t(gap < 0 ? "v_head_worse" : "v_head_better", { gap: num(Math.abs(gap)) });
  document.getElementById("vLede").textContent = t("v_lede", { series: w.series, days: Math.round(w.window_days), wname: wname(win),
    off: pct(off.mean_cap_pct), lit: lit ? pct(lit.mean_cap_pct) : "—", lit_delta: lit ? pts(lit.delta_vs_off_cap_pct) : "—",
    n_cost: nCost, best: pct(best.mean_cap_pct), best_delta: pts(best.delta_vs_off_cap_pct), best_set: setName(best), ht: pct(w.hold_through.mean_cap_pct) });
  const fig = (v, l, c) => `<div class="fig"><div class="v ${c || ""}">${v}</div><div class="l">${esc(l)}</div></div>`;
  document.getElementById("vFigures").innerHTML =
    fig(pct(off.mean_cap_pct), t("v_fig_off"), cls(off.mean_cap_pct)) +
    fig(lit ? pct(lit.mean_cap_pct) : "—", t("v_fig_lit"), lit ? cls(lit.delta_vs_off_cap_pct) : "") +
    fig(pct(best.mean_cap_pct), t("v_fig_best") + " · " + setName(best), cls(best.delta_vs_off_cap_pct)) +
    fig(pct(best.deployed_cap_pct), t("v_fig_depl"), "") +
    fig(`${best.excluded_negative} / ${best.excluded_positive}`, t("v_fig_ex"), "") +
    fig(pts(best.kept_delta_cap_pct / Math.max(1, best.traded_series)), t("v_fig_late"), cls(best.kept_delta_cap_pct));
  document.getElementById("vNote").textContent = t("v_note", { series: w.series });
}

function renderAnswer() {
  const w = W(), off = offOf(w), lit = litOf(w), best = bestOf(w, "cost"), abs = bestOf(w, "abs"), ht = w.hold_through;
  document.querySelector("#answer h2").textContent = t("an_h", { series: w.series });
  document.getElementById("anIntro").textContent = t("an_intro");
  const row = (who, sub, a, b, c) => `<div class="row"><div class="who">${esc(who)}<small>${esc(sub)}</small></div>` +
    `<div class="v ${cls(a)}">${pct(a)}</div><div class="v sub">${pct(b)}</div><div class="v sub">${num(c)}%</div></div>`;
  let html = `<div class="row head"><span>${esc(t("th_set"))}</span><span>${esc(t("th_univ"))}</span><span>${esc(t("th_depl"))}</span><span>${esc(t("th_pfdd"))}</span></div>`;
  html += row(t("an_off"), t("an_off_sub"), off.mean_cap_pct, off.deployed_cap_pct, off.pf_dd_cap_pct);
  if (lit) html += row(t("an_lit"), t("an_lit_sub"), lit.mean_cap_pct, lit.deployed_cap_pct, lit.pf_dd_cap_pct);
  html += row(t("an_best"), setName(best), best.mean_cap_pct, best.deployed_cap_pct, best.pf_dd_cap_pct);
  if (abs) html += row(t("an_abs"), setName(abs) + " — " + t("an_abs_sub"), abs.mean_cap_pct, abs.deployed_cap_pct, abs.pf_dd_cap_pct);
  html += row(t("an_ht"), t("an_ht_sub"), ht.mean_cap_pct, ht.mean_cap_pct, ht.pf_dd_cap_pct);
  document.getElementById("anBlock").innerHTML = html;
  const costs = w.sets.filter(s => s.kind === "cost");
  document.getElementById("anRead").textContent = t("an_read", { series: w.series, n_cost: costs.length,
    n_beat: costs.filter(s => s.mean_cap_pct > off.mean_cap_pct).length, n_beat_ht: costs.filter(s => s.mean_cap_pct > ht.mean_cap_pct).length,
    best_depl: pct(best.deployed_cap_pct), off_on_traded: pct(best.off_on_traded_cap_pct) });
}

function renderYears() {
  const head = [{ l: t("th_set") }].concat(WINS.map(w => ({ l: wname(w), num: true })));
  const rows = FOLLOW.map(spec => {
    const cells = [{ v: spec.kind === "off" ? t("kind_off") : spec.kind === "cost" ? `${num(spec.cost, 1)}× / ${spec.days}d` : `${num(spec.bps, 1)} bps / ${spec.days}d` }];
    WINS.forEach(wn => { const s = find(DATA.windows[wn], spec); cells.push(s ? P(s.mean_cap_pct) : { v: "—", cls: "num" }); });
    return cells;
  });
  rows.push([{ v: t("th_ht") }].concat(WINS.map(wn => P(DATA.windows[wn].hold_through.mean_cap_pct))));
  table("yearTable", head, rows);
  const deltas = WINS.map(wn => { const w = DATA.windows[wn], l = litOf(w); return `${wname(wn)} ${l ? pts(l.delta_vs_off_cap_pct) : "—"}`; }).join("; ");
  document.getElementById("yrRead").textContent = t("yr_read", { deltas, sizes: WINS.map(wn => `${wname(wn)} ${DATA.windows[wn].series}`).join("; ") });
}

function heat(id, cells, fmt, colorOf) {
  const ks = [...new Set(cells.map(c => c.k))].sort((a, b) => a - b), ds = [...new Set(cells.map(c => c.d))].sort((a, b) => a - b);
  const el = document.getElementById(id);
  el.style.gridTemplateColumns = `auto repeat(${ds.length}, auto)`;
  let html = `<div class="h"></div>` + ds.map(d => `<div class="h">${d}d</div>`).join("");
  ks.forEach(k => { html += `<div class="rh">${num(k, 1)}×</div>`; ds.forEach(d => { const c = cells.find(x => x.k === k && x.d === d);
    html += c ? `<div class="c" style="background:${colorOf(c.v)}">${fmt(c.v)}${c.sub !== undefined ? `<small>${c.sub}</small>` : ""}</div>` : `<div class="c">—</div>`; }); });
  el.innerHTML = html;
}

function renderGrid() {
  const w = W(), off = offOf(w);
  document.querySelector("#grid h2").textContent = t("gr_h", { n: w.sets.length });
  document.getElementById("grIntro").textContent = t("gr_intro");
  document.querySelector('[data-i18n="gr_heat2_sub"]').textContent = t("gr_heat2_sub", { series: w.series });
  const costs = w.sets.filter(s => s.kind === "cost");
  const vals = costs.map(s => s.mean_cap_pct), lo = Math.min(...vals, off.mean_cap_pct), hi = Math.max(...vals, off.mean_cap_pct);
  const shade = v => { const a = hi > lo ? (v - lo) / (hi - lo) : 0.5; return `color-mix(in srgb, var(--gain) ${Math.round(a * 45)}%, var(--surface))`; };
  heat("heatUniv", costs.map(s => ({ k: s.trail_cost, d: s.trail_days, v: s.mean_cap_pct, sub: pts(s.delta_vs_off_cap_pct, 2) })), v => pct(v, 2), shade);
  heat("heatTraded", costs.map(s => ({ k: s.trail_cost, d: s.trail_days, v: s.traded_series, sub: `${s.excluded_negative}↓ ${s.excluded_positive}↑` })), v => String(v),
    v => `color-mix(in srgb, var(--accent) ${Math.round(v / w.series * 35)}%, var(--surface))`);
  const head = [{ l: t("th_rank"), num: true }, { l: t("th_kind") }, { l: t("th_k"), num: true }, { l: t("th_days"), num: true }, { l: t("th_bps"), num: true },
    { l: t("th_univ"), num: true }, { l: t("th_delta"), num: true }, { l: t("th_pos"), num: true }, { l: t("th_traded"), num: true }, { l: t("th_depl"), num: true },
    { l: t("th_offOn"), num: true }, { l: t("th_htOn"), num: true }, { l: t("th_pfdd"), num: true }, { l: t("th_sdd"), num: true }, { l: t("th_worst"), num: true },
    { l: t("th_tps"), num: true }, { l: t("th_exN"), num: true }, { l: t("th_exSum"), num: true }, { l: t("th_late"), num: true }];
  table("gridTable", head, w.sets.map(s => [N(s.rank, 0), { v: t("kind_" + s.kind) }, N(s.kind === "cost" ? s.trail_cost : null, 1), N(s.trail_days || null, 0),
    N(s.kind === "abs" ? s.trail_bps : null, 1), P(s.mean_cap_pct), P(s.delta_vs_off_cap_pct), N(s.positive, 0), N(s.traded_series, 0), P(s.deployed_cap_pct),
    P(s.off_on_traded_cap_pct), P(s.ht_on_traded_cap_pct), N(s.pf_dd_cap_pct), N(s.mean_dd_cap_pct), P(s.worst_cap_pct), N(s.trades_per_series, 2),
    { v: s.excluded.length ? `${s.excluded.length} (${s.excluded_negative}↓ ${s.excluded_positive}↑)` : "0", cls: "num" },
    P(s.excluded_off_sum_cap_pct, 2), P(s.kept_delta_cap_pct, 2)]));
  const by = (f, vs) => vs.map(v => { const g = costs.filter(s => Math.abs(f(s) - v) < 1e-9); return `${v} ${pct(g.reduce((a, s) => a + s.mean_cap_pct, 0) / g.length, 3)}`; }).join(", ");
  const ex = d => { const g = costs.filter(s => s.trail_days === d); return g.length ? (g.reduce((a, s) => a + s.excluded.length, 0) / g.length).toFixed(1) : "—"; };
  document.getElementById("grRead").textContent = t("gr_read", { by_days: by(s => s.trail_days, [...new Set(costs.map(s => s.trail_days))].sort((a, b) => a - b)),
    by_k: by(s => s.trail_cost, [...new Set(costs.map(s => s.trail_cost))].sort((a, b) => a - b)), ex30: ex(30), ex90: ex(90) });
}

function renderExcluded() {
  const w = W(), off = offOf(w);
  const sets = w.sets.filter(s => s.kind !== "off");
  if (!exKey || !sets.find(s => s.key === exKey)) { const l = litOf(w); exKey = (l || sets[0]).key; }
  const s = sets.find(x => x.key === exKey);
  document.getElementById("exTabs").innerHTML = sets.slice().sort((a, b) => a.kind.localeCompare(b.kind) || a.trail_days - b.trail_days || a.trail_cost - b.trail_cost || a.trail_bps - b.trail_bps)
    .map(x => `<button type="button" data-key="${esc(x.key)}" aria-pressed="${x.key === exKey}">${esc(setName(x))}</button>`).join("");
  document.querySelectorAll("#exTabs button").forEach(b => b.onclick = () => { exKey = b.dataset.key; renderExcluded(); });
  const bySeries = Object.fromEntries(w.per_series.map(r => [r.key, r]));
  if (!s.excluded.length) { document.getElementById("exSummary").textContent = t("ex_none", { set: setName(s) }); document.getElementById("exTable").innerHTML = ""; return; }
  document.getElementById("exSummary").textContent = t("ex_summary", { set: setName(s), n: s.excluded.length, neg: s.excluded_negative, pos: s.excluded_positive,
    sum: pts(s.excluded_off_sum_cap_pct, 2), mean_univ: pts(s.excluded_off_sum_cap_pct / w.series, 3), kept: s.traded_series,
    late: pts(s.kept_delta_cap_pct, 2), late_mean: pts(s.kept_delta_cap_pct / Math.max(1, s.traded_series), 3) });
  const head = [{ l: t("th_series") }, { l: t("th_bridged") }, { l: t("th_cost"), num: true }, { l: t("th_mean_bps"), num: true }, { l: t("th_share"), num: true },
    { l: t("th_off"), num: true }, { l: t("th_off_trades"), num: true }, { l: t("th_ht2"), num: true }];
  const rows = s.excluded.map(k => bySeries[k]).filter(Boolean).sort((a, b) => a.off_cap_pct - b.off_cap_pct);
  table("exTable", head, rows.map(r => [{ v: `${r.symbol.replace(/USDT$/, "")} · ${r.perp.replace(/_futures$/, "")}` }, { v: r.quote_bridged ? t("yes") : t("no") },
    N(r.cost_pct, 3), N(r.mean_bps, 3), N(r.positive_share === null ? null : r.positive_share * 100, 0), P(r.off_cap_pct), N(r.off_trades, 0), P(r.ht_cap_pct)]));
}

function renderWF() {
  const pairs = DATA.pairs || [];
  document.querySelector("#wf p[data-i18n='wf_p']").textContent = t("wf_p", { n: W().sets.length });
  const head = [{ l: t("th_train") }, { l: t("th_chosen") }, { l: t("th_test") }, { l: t("th_ontest"), num: true }, { l: t("th_rank2"), num: true },
    { l: t("th_ship_test"), num: true }, { l: t("th_ht"), num: true }, { l: t("th_testbest"), num: true }];
  const nameOf = c => c.trailing_mean_min_cost_frac > 0 ? `${num(c.trailing_mean_min_cost_frac, 1)}× / ${c.trailing_mean_days}d` :
    c.min_trailing_mean_bps > 0 ? `${num(c.min_trailing_mean_bps, 1)} bps / ${c.trailing_mean_days}d` : t("kind_off");
  table("wfTable", head, pairs.map(p => [{ v: wname(p.train) }, { v: nameOf(p.chosen) }, { v: wname(p.test) },
    P(p.chosen_on_test ? p.chosen_on_test.mean_cap_pct : null), N(p.chosen_on_test ? p.chosen_on_test.rank : null, 0),
    P(p.applied_on_test ? p.applied_on_test.mean_cap_pct : null), P(p.test_hold_through.mean_cap_pct),
    { v: `${pct(p.test_best.mean_cap_pct)} · ${nameOf(p.test_best)}`, cls: "num" }]));
  document.getElementById("wfRead").textContent = pairs.map(p => t("wf_pair", { train: wname(p.train), test: wname(p.test), chosen: nameOf(p.chosen),
    on_test: pct(p.chosen_on_test ? p.chosen_on_test.mean_cap_pct : null), rank: p.chosen_on_test ? p.chosen_on_test.rank : "—", sets: p.test_sets,
    ship: pct(p.applied_on_test ? p.applied_on_test.mean_cap_pct : null), ht: pct(p.test_hold_through.mean_cap_pct) })).join(" ");
}

function renderMethod() {
  document.getElementById("meList").innerHTML = ["me_1", "me_2", "me_3", "me_4", "me_5", "me_6"].map(k => `<li>${esc(t(k, { n: W().sets.length }))}</li>`).join("");
  document.getElementById("meGloss").innerHTML = ["k", "late", "univ"].map(k => `<div><dt>${esc(t("gl_" + k))}</dt><dd>${esc(t("gl_" + k + "_d"))}</dd></div>`).join("");
  document.getElementById("footText").textContent = t("foot", META);
}

function render() {
  document.documentElement.lang = lang === "zh" ? "zh-CN" : "vi";
  document.title = t("title");
  document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = t(el.dataset.i18n); });
  document.getElementById("windowSeg").innerHTML = WINS.map(w => `<button type="button" data-win="${esc(w)}" aria-pressed="${w === win}">${esc(wname(w))}</button>`).join("");
  document.querySelectorAll("#windowSeg button").forEach(b => b.onclick = () => { win = b.dataset.win; render(); });
  document.querySelectorAll("#langSeg button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
  const w = W();
  document.getElementById("windowLabel").textContent = `${new Date(w.from_ms).toISOString().slice(0, 10)} → ${new Date(w.to_ms).toISOString().slice(0, 10)} · ${w.series} ${t("th_series").toLowerCase()}`;
  renderVerdict(); renderAnswer(); renderYears(); renderGrid(); renderExcluded(); renderWF(); renderMethod();
}
document.querySelectorAll("#langSeg button").forEach(b => b.onclick = () => { lang = b.dataset.lang; render(); });
render();
</script>
